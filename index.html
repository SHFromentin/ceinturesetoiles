    <style>
    body {
        font-family: 'Nunito', 'Inter', sans-serif;
        background: linear-gradient(135deg, #89f7fe 0%, #66a6ff 100%);
        animation: gradient-animation 15s ease infinite;
        background-size: 200% 200%;
    }

    /* === IDENTITÉ VISUELLE === */
    :root{--c-primary:#4f46e5;--c-primary-d:#4338ca;--c-ok:#16a34a;--c-danger:#dc2626;--c-ink:#1e293b;--c-soft:#eef2ff;}
    body{font-family:'Nunito','Inter',system-ui,sans-serif;background:linear-gradient(160deg,#eef2ff 0%,#e0f2fe 100%) fixed !important;animation:none !important;color:var(--c-ink);}
    .font-title{font-family:'Poppins','Nunito',sans-serif;letter-spacing:-.01em;}
    #app-container{background:#fff !important;backdrop-filter:none !important;border-radius:20px;box-shadow:0 10px 40px rgba(30,41,59,.10);border:1px solid #e5e7eb;}
    button{border-radius:10px;font-weight:700;}
    button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #a5b4fc;outline-offset:1px;}
    button:disabled{opacity:.45;cursor:not-allowed;}
    .btn:hover{transform:translateY(-1px) !important;box-shadow:0 6px 16px rgba(30,41,59,.15) !important;}
    button.bg-indigo-600,button.bg-blue-600,button.bg-teal-600,button.bg-purple-600{background:var(--c-primary) !important;color:#fff;}
    button.bg-indigo-600:hover,button.bg-blue-600:hover,button.bg-teal-600:hover,button.bg-purple-600:hover{background:var(--c-primary-d) !important;}
    button.bg-green-500,button.bg-green-600{background:var(--c-ok) !important;color:#fff;}
    button.bg-red-500,button.bg-red-600{background:var(--c-danger) !important;color:#fff;}
    button.bg-orange-500,button.bg-orange-600{background:#ea580c !important;color:#fff;}
    button.bg-gray-200,button.bg-gray-300{background:#e5e7eb !important;color:#374151 !important;}
    button.bg-gray-600,button.bg-gray-700{background:#475569 !important;color:#fff;}
    .home-card{display:flex;align-items:center;gap:16px;width:100%;text-align:left;background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:18px 20px;box-shadow:0 2px 8px rgba(30,41,59,.06);transition:all .18s;color:var(--c-ink);}
    .home-card:hover{border-color:var(--c-primary);box-shadow:0 8px 24px rgba(79,70,229,.18);transform:translateY(-2px);}
    .home-card .hc-ico{width:56px;height:56px;border-radius:14px;background:var(--c-soft);display:flex;align-items:center;justify-content:center;font-size:28px;flex:0 0 auto;}
    .home-card .hc-t{font-size:1.2rem;font-weight:800;font-family:'Poppins','Nunito',sans-serif;}
    .home-card .hc-d{font-size:.9rem;color:#64748b;font-weight:500;}
    /* === TABLEAUX === */
    #teacher-progress-table th,#summary-section th,#registrations-section th{background:#eef2ff !important;color:#3730a3;font-size:.85rem;text-transform:uppercase;letter-spacing:.03em;}
    #teacher-progress-table th,#teacher-progress-table td{border-color:#e5e7eb !important;padding:.6rem .75rem !important;}
    #teacher-progress-table tbody tr:nth-child(even) td[style*="background-color:#FFF"]{background-color:#f8fafc !important;}
    #teacher-progress-table tbody tr:hover td{filter:brightness(.96);}
    #registrations-section tbody tr:nth-child(even){background:#f8fafc;}
    /* === NOTIFICATIONS === */
    #toast-zone{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:3000;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:calc(100% - 24px);max-width:420px;}
    .toast{background:#1e293b;color:#fff;padding:10px 16px;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.25);font-size:.92rem;font-weight:600;opacity:0;transform:translateY(8px);transition:all .25s;text-align:center;}
    .toast.show{opacity:1;transform:none;}
    .btn { transition: all 0.2s ease-in-out; }
    .btn:hover { transform: scale(1.05); box-shadow: 0 8px 25px rgba(0,0,0,0.15); }
    .tab-btn {
        position: relative;
        transition: all 0.2s;
        padding: 0.75rem 1.5rem;
        border-radius: 99px;
        border: 2px solid transparent;
        font-weight: 700;
    }
    .tab-btn.active {
        background-color: #4f46e5;
        color: white;
        box-shadow: 0 4px 14px rgba(79, 70, 229, 0.4);
    }
    .star-choice.selected {
        box-shadow: 0 0 0 4px #4ade80;
        background-color: #4ade80 !important;
        color: white !important;
        font-weight: bold;
    }
    [contenteditable]:focus { outline: 2px solid #6366f1; background-color: #eef2ff; }

    .progress-bar { background-color: rgba(0,0,0,0.1); border-radius: 99px; overflow: hidden; height: 10px; }
    .progress-bar-fill { height: 100%; background: linear-gradient(90deg, #4ade80, #34d399); border-radius: 99px; transition: width 0.5s ease-in-out; }

    @keyframes gradient-animation {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }
    @keyframes confetti-fall { 0% { transform: translateY(-100vh) rotateZ(0deg); opacity: 1;} 100% { transform: translateY(100vh) rotateZ(360deg); opacity: 0;} }
    .confetti { position: fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index: 1000; }
    .confetti-piece { position: absolute; width: 10px; height: 20px; top:-20px; animation: confetti-fall 3s linear infinite; }

    .note-indicator { position: absolute; top: 4px; right: 4px; width: 10px; height: 10px; background-color: #4f46e5; border-radius: 50%; border: 2px solid white; box-shadow: 0 0 5px #4f46e5; }
    .registration-indicator { position: absolute; top: 2px; left: 4px; font-size: 1.1rem; filter: drop-shadow(0 1px 1px rgba(0,0,0,0.3)); }

    #student-dashboard-screen, .student-space-card {
        background: rgba(255, 255, 255, 0.5);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .class-card {
        transition: all 0.3s ease;
        background-size: cover;
        background-position: center;
        position: relative;
        overflow: hidden;
        border: none;
    }
    .class-card:hover {
        transform: translateY(-10px) scale(1.03);
        box-shadow: 0 15px 30px rgba(0,0,0,0.2);
    }
    .class-card-overlay {
        position: absolute; top:0; left:0; right:0; bottom:0;
        background: linear-gradient(to top, rgba(0,0,0,0.7), rgba(0,0,0,0.2));
        transition: background-color 0.3s;
    }
    .class-card:hover .class-card-overlay { background-color: rgba(0,0,0,0.5); }

    .student-select-card {
        background: linear-gradient(120deg, #ffffff 0%, #f1f5f9 100%);
        transition: all 0.2s ease-out;
    }
    .student-select-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        background: white;
    }

    #student-header .text-5xl { font-size: 4.5rem; }

    .challenge-card {
        background: rgba(255, 255, 255, 0.7);
        border-radius: 1.25rem;
        box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        border: 1px solid rgba(255, 255, 255, 0.3);
        transition: all 0.2s;
    }
    .challenge-card:hover { box-shadow: 0 8px 20px rgba(0,0,0,0.1); }

    .challenge-arrow { animation: pulse 1.5s infinite; }

    .challenge-btn {
        font-weight: 700;
        border-radius: 0.75rem;
        border: 2px solid;
        transition: all 0.2s;
        padding: 0.5rem 1rem;
    }
    .challenge-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .challenge-btn.selected {
        transform: scale(1.05);
        border-color: #4ade80;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }
    .star-trophy-card {
        background: white;
        padding: 1rem;
        border-radius: 1rem;
        box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        animation: fadeIn 0.5s ease-out forwards;
        opacity: 0;
    }

    @keyframes pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.15); }
    }

    .pdf-export-container h1 { font-size: 18pt !important; margin-bottom: 20px !important; }
    .pdf-export-container, .pdf-export-container table { font-size: 8pt !important; }
    .pdf-export-container td, .pdf-export-container th { padding: 4px 6px !important; }
    .pdf-export-container .text-2xl { font-size: 14pt !important; }

    .sparkle-shape {
        transform-origin: center;
        animation: sparkle 2s infinite ease-in-out;
    }
    @keyframes sparkle {
        0%, 100% { transform: scale(0); opacity: 0.5; }
        50% { transform: scale(1); opacity: 1; }
    }
    
    </style>

<script>
document.addEventListener('DOMContentLoaded', () => {

    // ===================================
    //      ÉTAT DE L'APPLICATION
    // ===================================
    const DEFAULT_STARS_PALETTE = [
        { id: 's1', name: "Blanc", color: "#FFFFFF" }, { id: 's2', name: "Jaune", color: "#FFEB3B" },
        { id: 's3', name: "Orange", color: "#FFA500" }, { id: 's4', name: "Rose", color: "#FFC0CB" },
        { id: 's5', name: "Vert clair", color: "#90EE90" }, { id: 's6', name: "Vert foncé", color: "#006400" },
        { id: 's7', name: "Bleu clair", color: "#ADD8E6" }, { id: 's8', name: "Bleu foncé", color: "#00008B" },
        { id: 's14', name: "Gris", color: "#9E9E9E" },
        { id: 's9', name: "Violet", color: "#8A2BE2" }, { id: 's10', name: "Marron", color: "#8B4513" },
        { id: 's11', name: "Noire", color: "#000000" }, { id: 's12', name: "Noire 1 étoile", color: "#C0C0C0" },
        { id: 's13', name: "Noire 2 étoiles", color: "#F8C025" }
    ];
    const DEFAULT_AVATARS = ['😀','😎','😂','🥳','🥸','😇','🤠','🤡','👽','🤖','👾','👩‍🚀','👨‍🚀','🦸','🦹','🧙','🧚','🧛','🧜','🧝','🧞','🧟','🐙','🐞','🐢','🐬','🦖','🐳','🦄','🐲','🍀','🍄','⭐','⚡','🔥','💎','👑','🎩','⚽','🏀','🎨','🧪','💻'];
    let appState = {};
    let currentTeacherClassId = null;
    let selectedStudentClassId = null;
    let selectedStudentId = null;
    let selectedDomainForStars = null;
    let cellToUpdate = null;
    let studentViewMode = 'next-tests';
    let classImageToUpdate = null;
    let domainIconToUpdate = null;
    let avatarToUpdate = { context: null, studentId: null };
    let pendingPasswordStudentId = null;
    
    // === GESTIONNAIRE DE DONNÉES (localStorage) ===
    function generateStudentPassword() {
        return String(Math.floor(Math.random() * 10000)).padStart(4, '0');
    }

    window.selectStudent = (studentId) => {
        if (selectedStudentClassId) {
            selectedStudentId = studentId;
            checkForNewStarsAndCelebrate();
        } else {
            console.error("Erreur : ID de classe non sélectionné.");
            alert("Une erreur est survenue. Veuillez retourner choisir votre classe.");
        }
    };

    window.requestStudentPassword = (studentId) => {
        if (!selectedStudentClassId) {
            console.error("Erreur : ID de classe non sélectionné.");
            alert("Une erreur est survenue. Veuillez retourner choisir votre classe.");
            return;
        }
        pendingPasswordStudentId = studentId;
        renderStudentPasswordModal();
    };

    function renderStudentPasswordModal() {
        const modal = document.getElementById('student-password-modal');
        if (!pendingPasswordStudentId) { modal.classList.add('hidden'); modal.style.display = 'none'; return; }
        const cls = appState.classes[selectedStudentClassId];
        const student = cls.students.find(s => s.id === pendingPasswordStudentId);
        modal.innerHTML = `<div class="bg-white rounded-lg shadow-xl p-6 max-w-sm w-full text-center"><h3 class="text-lg font-bold mb-4">Bonjour <span class="text-indigo-600">${student.name}</span> !</h3><p class="text-gray-700 mb-4">Entre ton code à 4 chiffres :</p><input type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" id="student-password-input" class="w-full p-3 border rounded-md mb-4 text-center text-2xl tracking-widest" autofocus><p id="student-password-error" class="text-red-500 mb-2 hidden">Code incorrect.</p><div class="flex justify-center gap-4"><button id="cancel-student-password" class="bg-gray-300 px-4 py-2 rounded-md">Annuler</button><button id="confirm-student-password" class="bg-indigo-600 text-white px-4 py-2 rounded-md">Valider</button></div></div>`;
        modal.classList.remove('hidden');
        modal.style.display = 'flex';
        const input = document.getElementById('student-password-input');
        input.focus();
        input.addEventListener('keydown', (e) => { if (e.key === 'Enter') document.getElementById('confirm-student-password').click(); });
    }

    function loadState() {
        let savedState = null;
        try {
            const savedStateJSON = readPersistedJSON();
            savedState = savedStateJSON ? JSON.parse(savedStateJSON) : null;
        } catch (err) {
            console.error("Erreur d'accès au stockage local:", err);
            savedState = null;
        }

        try {
            if (savedState) {
                appState = savedState;
                if (!appState.availableAvatars) { appState.availableAvatars = DEFAULT_AVATARS; }
                Object.values(appState.classes).forEach(cls => {
                    if (typeof cls.icon === 'string' && cls.icon.startsWith('#')) cls.icon = null;
                    if(cls.domains) {
                        cls.domains.forEach(d => {
                            if (d.icon === undefined) d.icon = null;
                            if (d.isVisible === undefined) d.isVisible = true; // NEW: Default domains to visible
                        });
                    }
                    if (cls.students.length > 0 && typeof cls.students[0] === 'string') {
                        const studentNameMap = new Map();
                        cls.students = cls.students.map(name => {
                            const newId = generateId();
                            studentNameMap.set(name, newId);
                            return { id: newId, name: name, avatar: appState.availableAvatars[0] };
                        });
                        const newProgress = {};
                        Object.entries(cls.progress || {}).forEach(([studentName, domains]) => {
                            const newId = studentNameMap.get(studentName);
                            if (newId) newProgress[newId] = domains;
                        });
                        cls.progress = newProgress;
                        cls.registrations.forEach(reg => {
                            const newId = studentNameMap.get(reg.student);
                            if (newId) { reg.studentId = newId; delete reg.student; }
                        });
                    }
                    Object.entries(cls.progress || {}).forEach(([studentId, domains]) => {
                        Object.entries(domains).forEach(([domainId, value]) => {
                            if (typeof value === 'string' || !value.hasOwnProperty('starId')) {
                                cls.progress[studentId][domainId] = { starId: value, note: '', isNew: false };
                            }
                        });
                    });
                });
            } else {
                const student1Id = generateId(), student2Id = generateId(), student3Id = generateId();
                appState = {
                    teacherPassword: 'prof1234',
                    availableAvatars: DEFAULT_AVATARS,
                    classes: {
                        'c1': {
                            id: 'c1', name: 'Classe de Démonstration', icon: null,
                            students: [ {id: student1Id, name: 'Alice', avatar: '👩‍🎓'}, {id: student2Id, name: 'Bob', avatar: '👨‍🎓'}, {id: student3Id, name: 'Charlie', avatar: '🧑‍🚀'} ],
                            domains: [ { id: 'd1', name: 'Calcul', icon: '🧮', isVisible: true, stars: JSON.parse(JSON.stringify(DEFAULT_STARS_PALETTE)) }, { id: 'd2', name: 'Lecture', icon: '📖', isVisible: true, stars: JSON.parse(JSON.stringify(DEFAULT_STARS_PALETTE)) } ],
                            progress: {
                                [student1Id]: { 'd1': { starId: 's2', note: 'Bravo !', isNew: false } },
                                [student2Id]: { 'd1': { starId: 's1', note: '', isNew: false }, 'd2': { starId: 's1', note: '', isNew: false } }
                            },
                            registrations: [ { studentId: student1Id, domainId: 'd1', starId: 's3' } ]
                        }
                    }
                };
            }
        } catch (err) {
            console.error("Erreur critique lors du chargement des données:", err);

    // === MOT DU TITRE (ceintures / étoiles...) ET RAPPEL DE SAUVEGARDE ===
    function titleWords() {
        const t = (appState.appTitle || 'Suivi des ceintures').trim().split(/\s+/);
        const pl = (t[t.length - 1] || 'ceintures').toLowerCase();
        const sg = pl.length > 1 && pl.endsWith('s') ? pl.slice(0, -1) : pl;
        return { pl, sg };
    }
    function caseLike(src, w) { return src[0] === src[0].toUpperCase() && src[0] !== src[0].toLowerCase() ? w[0].toUpperCase() + w.slice(1) : w; }
    function wordT(str) {
        if (typeof str !== 'string' || !/ceinture/i.test(str)) return str;
        const { pl, sg } = titleWords(), vow = /^[aeiouyéèêâîôhàù]/i;
        return str.replace(/\b(ma|ta|sa|Ma|Ta|Sa)(\s+)([Cc]einture)\b/g, (m, a, sp, w) => { const word = caseLike(w, sg); return vow.test(word) ? (a[0] + (a[1] === 'a' ? 'on' : 'on')) + sp + word : m.replace(/[Cc]einture/, word); }).replace(/\b(la|de|La|De)(\s+)([Cc]einture?s?)/g, (m, art, sp, w) => {
            const base = /s$/i.test(w) ? pl : sg, word = caseLike(w, base);
            if (!vow.test(word)) return art + sp + word;
            return (art.toLowerCase() === 'la' ? art[0] + "'" : art[0] + "'") + word;
        }).replace(/ceintures?/gi, w => caseLike(w, /s$/i.test(w) ? pl : sg));
    }
    const _nodeRec = new WeakMap();
    function walkWord(root) {
        if (!root) return;
        const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
        const nodes = []; let n; while ((n = w.nextNode())) nodes.push(n);
        nodes.forEach(t => {
            const par = t.parentElement; if (!par || par.closest('[contenteditable="true"],script,style,textarea')) return;
            const rec = _nodeRec.get(t);
            const orig = rec && t.nodeValue === rec.out ? rec.orig : t.nodeValue;
            const out = wordT(orig);
            if (out !== t.nodeValue) t.nodeValue = out;
            if (out !== orig || rec) _nodeRec.set(t, { orig, out });
        });
        (root.querySelectorAll ? root.querySelectorAll('[placeholder],[title]') : []).forEach(el => {
            ['placeholder', 'title'].forEach(a => {
                if (!el.hasAttribute(a)) return;
                const k = 'data-o-' + a; if (!el.hasAttribute(k)) { if (!/ceinture/i.test(el.getAttribute(a))) return; el.setAttribute(k, el.getAttribute(a)); }
                el.setAttribute(a, wordT(el.getAttribute(k)));
            });
        });
    }
    let _wordBusy = false;

    function ensureReg(cls) {

    function effLevel(cls, sid, d) {
        const p = cls.progress[sid]?.[d.id];

        return d.stars.slice(0, i + 1).filter(s => !s.excluded).length;

    function checkReg(cls, sid, domain, nextStar) {
        ensureReg(cls);
        if (domain.noReg || nextStar.excluded) return { ok: false, reason: "Ce domaine est passé avec l'enseignant (pas d'inscription)." };
        const g = cls.groups.find(x => x.id === domain.groupId);
        if (!g) return { ok: true };
        if ((cls.lastSession[sid] || []).includes(domain.id)) return { ok: false, reason: "Tu viens de passer ce domaine : attends la prochaine session." };
        const used = cls.registrations.filter(r => r.studentId === sid && r.domainId !== domain.id && cls.domains.find(d => d.id === r.domainId)?.groupId === g.id).length;
        if (used >= g.max) return { ok: false, reason: `Limite atteinte pour ${g.name} (${g.max}).` };
        const target = effLevel(cls, sid, domain) + 1;
        for (const o of cls.domains) {
            if (o.id === domain.id || o.groupId !== g.id || o.isVisible === false || o.noReg) continue;
            const need = Math.min(target - g.gap, nonExcl(o));
            if (effLevel(cls, sid, o) < need) return { ok: false, reason: `Progresse d'abord en ${o.name} (niveau ${need} requis).` };
        }
        return { ok: true };
    }

    function printAsPdf(selector, title) {

            return;
        }
    
        const printableHTML = `
            <!DOCTYPE html>
            <html lang="fr">

                <title>${title}</title>
                <style>
                    body { font-family: sans-serif; font-size: 10pt; }

                </style>
            </head>
            <body>
                <h1>${title}</h1>
                ${contentToPrint.innerHTML}
            </body>
            </html>
        `;
    
        const blob = new Blob([printableHTML], { type: 'text/html' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = title.replace(/ /g, '_') + '.html';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        alert("Un fichier HTML a été téléchargé. Ouvrez-le et utilisez la fonction 'Imprimer' de votre navigateur pour le sauvegarder en PDF.");
    }

    async function shareDataAsFile(dataToShare, fileName) {
        const jsonString = JSON.stringify(dataToShare, null, 2);
        const blob = new Blob([jsonString], { type: 'application/json' });
        const file = new File([blob], fileName, { type: 'application/json' });

        // Cascade de fallback, comme conseillé
        // 1. Essayer de partager le fichier (le mieux pour mobile)
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
            try {
                await navigator.share({ files: [file], title: fileName, text: `Données: ${fileName}` });
                return; // Succès
            } catch (error) {
                console.warn("Partage de fichier échoué, essai avec texte seul.", error);
            }
        }
    
        // 2. Essayer de partager le texte JSON
        if (navigator.share) {
             try {
                await navigator.share({ text: jsonString, title: fileName });
                return; // Succès
            } catch (error) {
                console.warn("Partage de texte échoué, essai avec presse-papiers.", error);
            }
        }

        // 3. Essayer de copier dans le presse-papiers
        try {
            await navigator.clipboard.writeText(jsonString);
            alert(`Partage non disponible. Les données (${fileName}) ont été copiées dans le presse-papiers.`);
            return;
        } catch (err) {
            console.warn("Copie dans le presse-papiers échoué, déclenchement du téléchargement.", err);
        }
        
        // 4. Dernier recours : téléchargement du fichier
        try {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = fileName;
            a.click();
            URL.revokeObjectURL(url);
        } catch(e) {
             alert('Erreur: Impossible de partager, copier ou télécharger les données.');
        }
    }

    function checkForNewStarsAndCelebrate() {
        const cls = appState.classes[selectedStudentClassId];
        const studentProgress = cls.progress[selectedStudentId] || {};
        const newStars = [];
        Object.entries(studentProgress).forEach(([domainId, progress]) => {
            if (progress.isNew) {
                const domain = cls.domains.find(d => d.id === domainId);
                const star = domain.stars.find(s => s.id === progress.starId);
                if (domain && star) { newStars.push({ domainName: domain.name, starName: star.name, starColor: star.color }); progress.isNew = false; }
            }
        });

        if (newStars.length > 0) {
            saveState();
            const modal = document.getElementById('celebration-modal');
            const student = cls.students.find(s => s.id === selectedStudentId);
            const newStarsHtml = newStars.map(s => `<div class="flex items-center gap-4"><div class="w-8 h-8 rounded-full border" style="background-color: ${s.starColor}"></div><p class="text-lg"><strong>${s.starName}</strong> en ${s.domainName}</p></div>`).join('');
            modal.innerHTML = `<div class="bg-white rounded-2xl p-8 text-center shadow-2xl transform transition-all animate-pulse"><h2 class="text-4xl font-bold text-yellow-500 mb-4 font-title">Félicitations, ${student.name} !</h2><p class="text-xl text-gray-700 mb-6">Tu as obtenu de nouvelles ceintures :</p><div class="space-y-4 mb-8 text-left">${newStarsHtml}</div><button id="close-celebration" class="bg-green-500 text-white px-8 py-3 rounded-lg font-bold text-lg">Continuer</button></div>`;
            modal.classList.remove('hidden');
            modal.style.display = 'flex';
            spawnConfetti();
        } else {
            const res = cls.lastResults?.[selectedStudentId];
            if (res && res.fail.length && !res.ok.length && !res.seen) {
                res.seen = true; saveState();
                const student = cls.students.find(x => x.id === selectedStudentId);
                const txt = pickMsg(selectedStudentId + '|' + res.fail.join(','), ENC_FAIL).replace('{d}', res.fail.join(', '));
                const modal = document.getElementById('celebration-modal');
                modal.innerHTML = `<div class="bg-white rounded-2xl p-8 text-center shadow-2xl max-w-md"><h2 class="text-3xl font-bold text-indigo-600 mb-4 font-title">Courage, ${student.name} !</h2><p class="text-xl text-gray-700 mb-8">${txt}</p><button id="close-celebration" class="bg-indigo-500 text-white px-8 py-3 rounded-lg font-bold text-lg">Continuer</button></div>`;
                modal.classList.remove('hidden'); modal.style.display = 'flex'; applyWord();
            } else {
                showScreen('student-dashboard-screen'); renderStudentDashboard();
            }
        }
    }

    function switchTab(tabId) {
        document.querySelectorAll('#teacher-tabs .tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.teacher-section').forEach(sec => sec.classList.add('hidden'));

        if(activeBtn) activeBtn.classList.add('active');

        const noClassMsg = document.getElementById('no-class-message'), sectionsWrapper = document.getElementById('teacher-sections-wrapper');
        if (!currentTeacherClassId && tabId !== 'settings-section') { sectionsWrapper.classList.add('hidden'); noClassMsg.classList.remove('hidden'); return; }

        sectionsWrapper.classList.remove('hidden'); noClassMsg.classList.add('hidden');
        document.getElementById(tabId).classList.remove('hidden');

        switch (tabId) {
            case 'summary-section': renderSummarySection(); break;
            case 'help-section': renderHelpSection(); break;
            case 'lessons-section': renderLessonsSection(); break;
            case 'progress-grid-section': renderProgressGrid(); break;
            case 'registrations-section': renderRegistrationsSection(); break;
            case 'students-section': renderStudentsSection(); break;
            case 'domains-section': renderDomainsSection(); break;

    function renderSummarySection() {
        const cls = getCurrentClass(); const container = document.getElementById('summary-section'); if (!cls) return;
        let content = `<h2 class="text-2xl font-bold mb-4 font-title">Synthèse de la classe : ${cls.name}</h2>`;

        const totalPossibleStars = cls.domains.reduce((sum, d) => sum + d.stars.length, 0);
        const studentSummaries = [...cls.students].sort((a,b)=>a.name.localeCompare(b.name)).map(student => {
            const starsObtained = Object.keys(cls.progress[student.id] || {}).length;

            return `<div class="p-3 bg-gray-50 rounded-lg border"><div class="flex justify-between items-center mb-1"><p class="font-bold text-lg flex items-center gap-2"><span class="text-2xl">${student.avatar}</span>${student.name}</p><p class="font-semibold text-gray-700">${starsObtained} / ${totalPossibleStars} ceintures</p></div><div class="progress-bar h-4 w-full"><div class="progress-bar-fill" style="width: ${percentage}%"></div></div></div>`;
        }).join('');
        container.innerHTML = content + `<div class="space-y-4">${studentSummaries}</div>`;

    function renderRegistrationsSection() {
        const cls = getCurrentClass(); const container = document.getElementById('registrations-section');
        let topButtons = `<div class="flex flex-wrap gap-2 mb-4">
            <button id="export-registrations-pdf" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-3 rounded-lg text-sm">🖨️ Exporter PDF (PC)</button>
            <button id="print-registrations-btn" class="bg-teal-600 hover:bg-teal-700 text-white font-bold py-2 px-3 rounded-lg text-sm">📱 Imprimer/PDF (Mobile)</button>
            <button id="reset-registrations-btn" class="bg-red-500 hover:bg-red-600 text-white font-bold py-2 px-4 rounded-lg">Fin de session / Réinitialiser</button>
        </div>`;
        let gridContent = '<div class="grid md:grid-cols-2 gap-8">';
        let leftColumn = '<div><h3 class="text-2xl font-bold mb-3 font-title">Tests prévus</h3>';
        if (cls.registrations.length === 0) { leftColumn += `<p class="text-gray-500 italic">Aucune inscription.</p>`;
        } else {
            const grouped = {};
            cls.registrations.forEach(reg => {
                const domain = cls.domains.find(d => d.id === reg.domainId);
                const star = domain.stars.find(s => s.id === reg.starId);
                if (!domain || !star) return;
                const key = `${domain.name}`;
                if (!grouped[key]) grouped[key] = {};
                if (!grouped[key][star.name]) { grouped[key][star.name] = { color: star.color, names: [] }; }
                const student = cls.students.find(s => s.id === reg.studentId);
                if(student) grouped[key][star.name].names.push(student.name);
            });
            let listHtml = '<div id="pdf-export-content" class="space-y-6">';
            for (const domainName in grouped) {
                listHtml += `<div class="p-4 border rounded-lg"><h4 class="text-xl font-semibold mb-3">${domainName}</h4><div class="space-y-2">`;
                for (const starName in grouped[domainName]) {
                    const data = grouped[domainName][starName];
                    listHtml += `<div><h5 class="font-medium text-lg flex items-center gap-2"><span class="w-5 h-5 rounded-full border" style="background-color: ${data.color}"></span>ceinture ${starName} <span class="text-sm font-normal text-gray-600">(${data.names.length} test${data.names.length > 1 ? 's' : ''})</span></h5><p class="text-gray-700 pl-7">${[...data.names].sort().join(', ')}</p></div>`;
                }
                listHtml += '</div></div>';
            }
            listHtml += '</div>'; leftColumn += listHtml;
        }
        leftColumn += '</div>';
        let rightColumn = '<div><h3 class="text-2xl font-bold mb-3 font-title">Élèves en attente de choix</h3>';
        const registrationCounts = {};
        cls.registrations.forEach(r => { registrationCounts[r.studentId] = (registrationCounts[r.studentId] || 0) + 1; });
        const pendingStudents = [...cls.students].sort((a,b) => a.name.localeCompare(b.name)).filter(student => (registrationCounts[student.id] || 0) < 1);
        if (pendingStudents.length === 0) { rightColumn += `<p class="text-gray-500 italic">Tous les élèves ont choisi 2 tests.</p>`;
        } else {

    function renderTeacherRegistrationModal(studentId) {
        const modal = document.getElementById('teacher-registration-modal');

        const student = cls.students.find(s => s.id === studentId);
        if (!student) return;

        const studentRegistrations = cls.registrations.filter(r => r.studentId === studentId);
        const canRegisterCount = 99;

        let availableTestsHtml = '';
        cls.domains.forEach(domain => {
            const progress = cls.progress[studentId]?.[domain.id];
            const currentStarIndex = progress ? domain.stars.findIndex(s => s.id === progress.starId) : -1;

                availableTestsHtml += `

    let displayClassId = null, displayTimer = null;
    function renderDisplay() {
        const ids = Object.keys(appState.classes);
        if (!displayClassId || !appState.classes[displayClassId]) displayClassId = ids[0];
        document.getElementById('display-tabs').innerHTML = ids.map(id => `<button data-display-class="${id}" class="tab-btn ${id === displayClassId ? 'active' : 'bg-gray-100'}" style="padding:4px 18px;">${appState.classes[id].name}</button>`).join('');
        const cls = appState.classes[displayClassId], body = document.getElementById('display-body');
        if (!cls) { body.innerHTML = ''; return; }
        const doms = cls.domains.filter(d => d.isVisible !== false);
        const studs = [...cls.students].sort((a, b) => a.name.localeCompare(b.name));
        const now = Date.now(), rec = {}, recS = {};
        (cls.history || []).forEach(h => { if (now - new Date(h.date) < 7 * 864e5) { rec[h.studentId + '|' + h.domainId] = 1; recS[h.studentId] = 1; } });
        if (!studs.length || !doms.length) { body.innerHTML = '<p style="text-align:center;color:#888;margin-top:40px">Aucun élève ou domaine.</p>'; return; }
        const head = '<tr><th style="border:1px solid #ccc;background:#f3f4f6;text-align:left;padding:1px 4px;">Prénom</th>' + doms.map(d => `<th style="border:1px solid #ccc;background:#f3f4f6;padding:1px 2px;overflow:hidden;">${d.name}</th>`).join('') + '</tr>';
        const rows = studs.map(s => '<tr><td style="border:1px solid #ccc;font-weight:700;padding:1px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;' + (recS[s.id] ? 'background:#fef08a;' : '') + '">' + (recS[s.id] ? '✨ ' : '') + s.avatar + ' ' + s.name + '</td>' + doms.map(d => {
            const p = cls.progress[s.id]?.[d.id], st = p ? d.stars.find(x => x.id === p.starId) : null;
            const reg = cls.registrations.some(r => r.studentId === s.id && r.domainId === d.id) ? ' 🗒️' : '';
            return `<td style="border:1px solid #ccc;text-align:center;overflow:hidden;padding:0 2px;box-shadow:${rec[s.id + '|' + d.id] ? 'inset 0 0 0 3px #f59e0b' : 'none'};background:${st ? st.color : '#fff'};color:${st && !isLightColor(st.color) ? '#fff' : '#000'}">${rec[s.id + '|' + d.id] ? '✨ ' : ''}${st ? st.name : ''}${reg}</td>`;
        }).join('') + '</tr>').join('');
        body.innerHTML = `<table id="display-table" style="width:100%;height:100%;table-layout:fixed;border-collapse:collapse;"><thead>${head}</thead><tbody>${rows}</tbody></table>`;
        const t = document.getElementById('display-table');
        let fs = Math.min(26, Math.max(7, body.clientHeight / (studs.length + 1) * 0.5));
        t.style.fontSize = fs + 'px';
        while (t.scrollHeight > body.clientHeight + 1 && fs > 5) { fs -= 0.5; t.style.fontSize = fs + 'px'; }
    }

    // === Réglages groupes / ceintures exclues ===

        // ==========================================================================

        const helps = (cls.helpRequests || []).filter(h => h.studentId === st.id).map(h => h.id + ':' + h.status).sort();

    function syComputeSigs() {

        Object.entries(appState.classes).forEach(([cid, cls]) => {
            cls.studentMeta = cls.studentMeta || {};
            (cls.students || []).forEach(st => {
                const k = cid + '|' + st.id, sg = syStudentSig(cls, st);

    // --- bouton Transférer ---
    async function syTransfer() {
        const d = new Date(), p = x => String(x).padStart(2, '0');

            } catch (err) {

    // --- restauration : avertissement si le fichier est plus ancien + copie de sécurité ---

            if (a && b && a < b && !confirm("⚠️ Ce fichier est plus ancien que les données de cet appareil.\n\nFichier : " + syFmt(a) + "\nCet appareil : " + syFmt(b) + "\n\nLa restauration écrasera les données les plus récentes. Continuer ?")) return;
            if (!a && b && !confirm("⚠️ Ce fichier n'a pas de date (ancienne sauvegarde) : impossible de savoir s'il est plus ancien que les données de cet appareil.\n\nContinuer la restauration ?")) return;
        }

    // --- fusion des tablettes ---
    function syPlanMerge(files) {
        const work = JSON.parse(JSON.stringify(appState));
        const rep = { files: [], classes: {}, warnings: [], students: 0, regAdd: 0, regDel: 0, helpAdd: 0, avatars: 0, unknown: 0 };
        const touched = {};
        files.forEach(f => {
            const d = f.data;
            if (!d || typeof d !== 'object' || !d.classes || typeof d.classes !== 'object') { rep.warnings.push(`« ${syEsc(f.name)} » n'est pas un fichier de sauvegarde de l'appli : ignoré.`); return; }
            rep.files.push(f.name);
            Object.entries(d.classes).forEach(([cid, src]) => {
                const dst = work.classes[cid];
                if (!dst) { rep.warnings.push(`Classe « ${syEsc(src.name || cid)} » absente de cet appareil : ignorée.`); return; }
                dst.studentMeta = dst.studentMeta || {}; dst.registrations = dst.registrations || []; dst.helpRequests = dst.helpRequests || [];
                const sm = src.studentMeta || {};
                const cr = rep.classes[cid] || (rep.classes[cid] = { name: dst.name, lines: [] });
                (src.students || []).forEach(sst => {
                    const dstu = (dst.students || []).find(x => x.id === sst.id);
                    if (!dstu) { rep.unknown++; return; }
                    const key = cid + '|' + sst.id;
                    // les ceintures vues par l'élève sur la tablette ne reviennent plus en « nouveauté »
                    const sp = (src.progress || {})[sst.id], dp = (dst.progress || {})[sst.id];
                    if (sp && dp) Object.keys(sp).forEach(did => { if (dp[did] && sp[did] && sp[did].isNew === false && dp[did].isNew === true && sp[did].starId === dp[did].starId) dp[did].isNew = false; });
                    const sl = (src.lastResults || {})[sst.id], dl = (dst.lastResults || {})[sst.id];
                    if (sl && dl && sl.seen && JSON.stringify(sl.fail) === JSON.stringify(dl.fail) && JSON.stringify(sl.ok) === JSON.stringify(dl.ok)) dl.seen = true;

                    const tsS = sm[sst.id] || 0, tsD = dst.studentMeta[sst.id] || 0;
                    const differs = syMergeSig(src, sst) !== syMergeSig(dst, dstu);
                    if (touched[key] && differs) rep.warnings.push(`${syEsc(dstu.name)} : modifié(e) dans plusieurs fichiers, la version la plus récente est conservée.`);
                    if (tsS <= tsD || !differs) { if (tsS > tsD) dst.studentMeta[sst.id] = tsS; return; }

                    const oldRegs = dst.registrations.filter(r => r.studentId === sst.id);
                    const newRegs = (src.registrations || []).filter(r => r.studentId === sst.id).filter(r => { const dm = dst.domains.find(x => x.id === r.domainId); return dm && dm.stars.some(x => x.id === r.starId); });
                    const kk = r => r.domainId + '|' + r.starId;
                    const oldK = new Set(oldRegs.map(kk)), newK = new Set(newRegs.map(kk));
                    const add = [...newK].filter(x => !oldK.has(x)).length, del = [...oldK].filter(x => !newK.has(x)).length;
                    dst.registrations = dst.registrations.filter(r => r.studentId !== sst.id).concat(newRegs.map(r => ({ studentId: r.studentId, domainId: r.domainId, starId: r.starId })));

                    const dh = dst.helpRequests.filter(h => h.studentId === sst.id), sh = (src.helpRequests || []).filter(h => h.studentId === sst.id);
                    const merged = []; let hAdd = 0;
                    sh.forEach(h => { const o = dh.find(x => x.id === h.id); if (!o) { merged.push(h); hAdd++; } else { merged.push((SY_RANK[o.status] || 0) > (SY_RANK[h.status] || 0) ? o : Object.assign({}, h)); } });
                    dh.forEach(o => { if (!sh.some(h => h.id === o.id) && o.status !== 'open') merged.push(o); });
                    dst.helpRequests = dst.helpRequests.filter(h => h.studentId !== sst.id).concat(merged);

                    let av = false;
                    if (sst.avatar && sst.avatar !== dstu.avatar) { dstu.avatar = sst.avatar; av = true; }
                    dst.studentMeta[sst.id] = tsS; touched[key] = true;
                    if (add || del || hAdd || av) {
                        rep.students++; rep.regAdd += add; rep.regDel += del; rep.helpAdd += hAdd; if (av) rep.avatars++;
                        const parts = [];
                        if (add) parts.push('+' + add + ' inscription(s)');
                        if (del) parts.push('−' + del + ' inscription(s)');
                        if (hAdd) parts.push(hAdd + " demande(s) d'aide");
                        if (av) parts.push('avatar');
                        cr.lines.push(`<li><b>${syEsc(dstu.name)}</b> : ${parts.join(', ')}</li>`);
                    }
                });
            });
        });

    }

        const summary = nothing
            ? '<p class="text-gray-600 italic">Rien à fusionner : ce fichier ne contient aucune modification plus récente que les données de cet appareil.</p>'
            : `<p class="font-semibold mb-1">${r.students} élève(s) mis à jour · ${r.regAdd} inscription(s) ajoutée(s) · ${r.regDel} retirée(s) · ${r.helpAdd} demande(s) d'aide${r.avatars ? ' · ' + r.avatars + ' avatar(s)' : ''}</p>${classes}`;
        syShowModal('sy-merge-modal', `<div class="flex justify-between items-center mb-3"><h3 class="text-2xl font-bold font-title">🔀 Fusion des tablettes</h3></div><p class="text-sm text-gray-500 mb-2">Fichier(s) analysé(s) : ${r.files.length ? r.files.map(syEsc).join(', ') : 'aucun'}</p>${summary}${warns}<p class="text-xs text-gray-500 mt-3">Les ceintures, domaines et historique de cet appareil ne sont pas modifiés. Une copie de sécurité est créée avant la fusion.</p><div class="flex justify-end gap-2 mt-4"><button data-sync="merge-cancel" class="bg-gray-300 px-4 py-2">${nothing ? 'Fermer' : 'Annuler'}</button>${nothing ? '' : '<button data-sync="merge-apply" class="bg-indigo-600 text-white px-4 py-2">Fusionner</button>'}</div>`);
    }
    function syApplyMerge() {
        if (!syPending) return;
        const { work, rep } = syPending;
        sySnapshotNow('avant fusion');
        appState = work; syPending = null;
        saveState();
        ['sy-merge-modal'].forEach(id => { const m = document.getElementById(id); if (m) m.remove(); });
        toast(`✅ Fusion terminée : ${rep.students} élève(s), ${rep.regAdd} inscription(s) ajoutée(s)`, 5000);
        try { renderSettingsSection(); } catch (e) { }
    }
    function syOpenPaste() {
        syShowModal('sy-paste-modal', `<h3 class="text-xl font-bold mb-2 font-title">📋 Fusion via copier/coller</h3><p class="text-sm text-gray-600 mb-2">Colle ici le contenu complet du fichier d'une tablette (une tablette à la fois).</p><textarea id="sy-paste-text" class="w-full h-40 p-2 border rounded-md font-mono text-xs"></textarea><div class="flex justify-end gap-2 mt-3"><button data-sync="merge-cancel" class="bg-gray-300 px-4 py-2">Annuler</button><button data-sync="paste-analyze" class="bg-indigo-600 text-white px-4 py-2">Analyser</button></div>`);
    }
    function syAnalyzePaste() {
        const t = (document.getElementById('sy-paste-text') || {}).value || '';
        let data = null; try { data = JSON.parse(t.trim()); } catch (e) { toast('Texte invalide : colle le fichier JSON en entier.'); return; }
        syCloseModals(); syOpenMerge([{ name: 'texte collé', data }]);
    }

    // --- interface : paramètres, aide, bandeaux ---
    const _syRenderSet = renderSettingsSection;
    renderSettingsSection = function () {
        _syRenderSet();
        document.getElementById('settings-section').insertAdjacentHTML('afterbegin', `<div class="mb-6 p-4 border rounded-lg bg-indigo-50"><h3 class="text-xl font-bold mb-1 font-title">🔄 Transfert entre appareils</h3><p class="text-sm text-gray-600 mb-2">Smartphone ⇄ tablettes, sans serveur : <b>Transférer</b> envoie les données de cet appareil ; <b>Fusionner</b> récupère les inscriptions faites sur une tablette sans toucher aux ceintures.</p><div id="sy-status" class="text-sm mb-3"></div><label class="text-sm block mb-3">Nom de cet appareil (utilisé dans le nom des fichiers) <input type="text" id="sy-device-name" maxlength="30" value="${syEsc(syDevNameRaw())}" placeholder="Tablette 1" class="p-1 border rounded-md ml-1"></label><div class="flex flex-wrap gap-2 mb-4"><button data-sync="transfer" class="bg-indigo-600 text-white py-2 px-4">📤 Transférer</button><button data-sync="merge-file" class="bg-green-500 text-white py-2 px-4">🔀 Fusionner des tablettes (fichiers)</button><button data-sync="merge-paste" class="bg-gray-600 text-white py-2 px-4">📋 Fusionner (copier/coller)</button></div><div class="flex flex-wrap gap-2 mb-2"><button data-lt="create" class="bg-purple-600 text-white py-2 px-4">🔗 Créer un lien de transfert</button></div><p class="text-xs text-gray-500 mb-4">Pour le mode enfant (ni fichier ni copier/coller) : le lien contient toutes les données ; ouvert sur la tablette, il propose de les restaurer.</p><h4 class="font-semibold mb-1">🛟 Copies de sécurité automatiques (sur cet appareil)</h4><p class="text-xs text-gray-500 mb-2">Gardées localement : à chaque restauration, fusion ou fin de session, puis environ toutes les 15 minutes de modifications. Elles restent sur cet appareil et ne remplacent pas le transfert.</p><div id="sy-snaps"></div><button data-sync="snap-now" class="bg-gray-200 text-sm py-1 px-3 mt-2">Créer une copie maintenant</button></div>`);
        syRender(); syRenderSnaps(); applyWord();
    };
    HELP_TABS['settings-section'][1].push("<b>🔄 Transfert entre appareils</b> : « Transférer » partage les données de cet appareil. « Fusionner des tablettes » récupère les inscriptions et demandes d'aide des tablettes sans toucher aux ceintures. Fais la fusion AVANT « Fin de session ». Les copies de sécurité locales permettent de revenir en arrière.");
    const _syShowScreen = showScreen;
    showScreen = function (id) { _syShowScreen(id); syRender(); };

    document.addEventListener('change', e => { if (e.target.id === 'sy-device-name') { try { localStorage.setItem(SY_DEV_KEY, e.target.value.trim()); } catch (err) { } } });
    document.addEventListener('click', e => {
        const b = e.target.closest('[data-sync]');
        if (b) {
            const a = b.dataset.sync;
            if (a === 'transfer') syTransfer();
            else if (a === 'merge-file') { const i = document.getElementById('sy-merge-input'); if (i) i.click(); }
            else if (a === 'merge-paste') syOpenPaste();
            else if (a === 'merge-apply') syApplyMerge();
            else if (a === 'merge-cancel') syCloseModals();
            else if (a === 'paste-analyze') syAnalyzePaste();
            else if (a === 'snap-now') { toast(sySnapshotNow('manuelle') ? '🛟 Copie créée' : 'Données trop volumineuses pour une copie locale.'); syRenderSnaps(); }
        }
        const r = e.target.closest('[data-sync-restore]');
        if (r && confirm('Restaurer cette copie de sécurité ? Les données actuelles seront remplacées (une copie des données actuelles est créée avant).')) syRestoreSnap(Number(r.dataset.syncRestore));
        if (e.target.id === 'sy-merge-modal' || e.target.id === 'sy-paste-modal') syCloseModals();
        if (['copy-all-data-btn', 'export-all-data-btn', 'share-all-data-btn'].includes(e.target.id)) setTimeout(syMarkTransferred, 600);
    });
    // alerte à la déconnexion enseignant et copie avant réinitialisation (phase de capture : avant les autres écouteurs)
    document.addEventListener('click', e => {
        if (e.target.closest('#logout-btn')) {
            const s = syEnsure(), n = s.changes || 0;
            if (n > 0 && !confirm('⚠️ ' + n + ' modification(s) non transférée(s) (dernier transfert : ' + (s.lastTransfer ? syFmt(s.lastTransfer) : 'jamais') + ").\n\nTe déconnecter quand même ? (Annuler pour revenir et utiliser « Transférer »)")) { e.stopImmediatePropagation(); e.preventDefault(); }
        }
        if (e.target.id === 'reset-all-data-btn') { sySnapshotNow('avant réinitialisation'); syNoUnloadWarn = true; setTimeout(() => { syNoUnloadWarn = false; }, 2500); }
    }, true);
    window.addEventListener('beforeunload', e => {
        if (syNoUnloadWarn || !appState || !appState.sync) return;
        if ((appState.sync.changes || 0) > 0) { e.preventDefault(); e.returnValue = ''; }
    });

    function syInit() {
        syEnsure(); syBaseline();
        const l = syReadSnaps(); syLastSnapAt = l.length ? l[l.length - 1].t : 0;
        const row = document.querySelector('#home-screen .space-y-6');
        if (row) row.insertAdjacentHTML('beforebegin', '<div id="sy-banner-home" class="max-w-md mx-auto mb-6 text-left"></div>');
        document.getElementById('teacher-view').insertAdjacentHTML('afterbegin', '<div id="sy-banner-teacher"></div>');
        document.body.insertAdjacentHTML('beforeend', '<input type="file" id="sy-merge-input" class="hidden" accept=".json,application/json" multiple>');
        document.getElementById('sy-merge-input').addEventListener('change', async e => {
            const files = [...e.target.files]; if (!files.length) return;
            const out = [];
            for (const f of files) { try { out.push({ name: f.name, data: JSON.parse(await f.text()) }); } catch (err) { out.push({ name: f.name, data: null }); } }
            e.target.value = ''; syOpenMerge(out);
        });
        setInterval(syRender, 60000);
        syRender();
    }

    // === LIEN DE TRANSFERT : pour les appareils sans fichiers ni copier/coller (mode enfant) ===
    // Les données voyagent dans la partie après « # » du lien : elle reste sur l'appareil et n'est jamais envoyée à GitHub.
    const LT_BASE = /^https?:/.test(location.protocol) ? location.origin + location.pathname : 'https://shfromentin.github.io/ceinturesetoiles/';
    let ltData = null;
    function ltB64(bytes) { let s = ''; for (let i = 0; i < bytes.length; i += 8192) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 8192)); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }
    function ltUnB64(b) { b = b.replace(/-/g, '+').replace(/_/g, '/'); while (b.length % 4) b += '='; const s = atob(b), u = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return u; }
    async function ltPack(text) {
        const raw = new TextEncoder().encode(text);
        if (typeof CompressionStream !== 'undefined') {
            try { const buf = await new Response(new Blob([raw]).stream().pipeThrough(new CompressionStream('deflate-raw'))).arrayBuffer(); return 'z.' + ltB64(new Uint8Array(buf)); } catch (e) { }
        }
        return 'j.' + ltB64(raw);
    }
    async function ltUnpack(f, b) {
        const bytes = ltUnB64(b);
        if (f === 'z') {
            if (typeof DecompressionStream === 'undefined') throw new Error("ce navigateur ne sait pas décompresser les données");
            return await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text();
        }
        return new TextDecoder().decode(bytes);
    }
    function ltClose() { const m = document.getElementById('lt-modal'); if (m) m.remove(); ltData = null; }

    // --- création du lien (téléphone) ---
    async function ltCreate() {
        let url;
        try { url = LT_BASE + '#donnees=' + await ltPack(JSON.stringify(appState)); } catch (e) { toast('Impossible de créer le lien.'); return; }
        syShowModal('lt-modal', `<h3 class="text-xl font-bold mb-2 font-title">🔗 Lien de transfert</h3><ol class="text-sm text-gray-700 mb-3" style="list-style:decimal;padding-left:1.2rem;"><li><b>Le plus simple :</b> touche « 📱 QR code » et scanne-le avec le scanner de la tablette.</li><li><b>Sinon :</b> copie le lien, ajoute-le comme site autorisé dans le contrôle parental de Samsung Kids, ouvre ce favori en mode enfant, puis supprime-le.</li></ol><textarea id="lt-url" readonly class="w-full h-28 p-2 border rounded-md font-mono text-xs" style="word-break:break-all;">${url}</textarea><p class="text-xs text-gray-500 mt-1">${url.length} caractères. Le lien contient toutes les données : ne le diffuse pas.</p><div class="flex flex-wrap justify-end gap-2 mt-4"><button data-lt="close" class="bg-gray-300 px-4 py-2">Fermer</button>${navigator.share ? '<button data-lt="share" class="bg-gray-600 text-white px-4 py-2">📤 Partager</button>' : ''}<button data-ltq="show" class="bg-purple-600 text-white px-4 py-2">📱 QR code</button><button data-lt="copy" class="bg-indigo-600 text-white px-4 py-2">📋 Copier le lien</button></div>`);
    }
    async function ltCopy() {
        const ta = document.getElementById('lt-url'); if (!ta) return;
        try { await navigator.clipboard.writeText(ta.value); }
        catch (e) { ta.focus(); ta.select(); try { document.execCommand('copy'); } catch (e2) { toast('Copie impossible : sélectionne le lien à la main.'); return; } }
        syMarkTransferred(); toast('📋 Lien copié');
    }

    // --- ouverture du lien (tablette) ---
    async function ltFromLink() {
        const m = /[#&]donnees=([zj])\.([A-Za-z0-9_\-]+)/.exec(location.hash || '');
        if (!m) return;
        try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { }
        let data;
        try { data = JSON.parse(await ltUnpack(m[1], m[2])); if (!data || !data.classes) throw new Error('contenu inattendu'); }
        catch (e) { alert('Lien de transfert illisible ou incomplet (' + e.message + ').\n\nVérifie que le lien a été copié en entier.'); return; }
        ltShowChoice(data);
    }
    function ltShowChoice(data) {
        ltData = data;
        const nCls = Object.keys(data.classes).length, nSt = Object.values(data.classes).reduce((a, c) => a + (c.students || []).length, 0);
        const when = data.sync && data.sync.lastModified ? ' · données du ' + syFmt(data.sync.lastModified) : '';
        syShowModal('lt-modal', `<h3 class="text-xl font-bold mb-2 font-title">🔗 Lien de transfert ouvert</h3><p class="text-sm text-gray-700 mb-3">${nCls} classe(s), ${nSt} élève(s)${when}.</p><label class="block text-sm font-semibold mb-1">Code enseignant (de cette tablette ou de l'appareil qui a créé le lien)</label><input id="lt-pwd" type="password" class="w-full p-2 border rounded-md mb-3"><div class="space-y-2"><button data-lt="restore" class="w-full bg-indigo-600 text-white px-4 py-3 text-left"><b>♻️ Restaurer</b><br><span class="text-sm">Données de référence (ton téléphone) : remplacent tout le contenu de cet appareil.</span></button><button data-lt="merge" class="w-full bg-green-600 text-white px-4 py-3 text-left"><b>🔀 Fusionner</b><br><span class="text-sm">Données venant d'une tablette d'élèves : récupère inscriptions et demandes d'aide, sans toucher aux ceintures.</span></button></div><div class="flex justify-end mt-4"><button data-lt="close" class="bg-gray-300 px-4 py-2">Annuler</button></div>`);
    }
    document.addEventListener('click', e => {
        const b = e.target.closest('[data-lt]');
        if (!b) { if (e.target.id === 'lt-modal') ltClose(); return; }
        const a = b.dataset.lt;
        if (a === 'create') ltCreate();
        else if (a === 'copy') ltCopy();
        else if (a === 'share') { const ta = document.getElementById('lt-url'); if (ta) navigator.share({ text: ta.value }).then(syMarkTransferred, () => { }); }
        else if (a === 'close') ltClose();
        else if (a === 'merge' || a === 'restore') {
            const data = ltData, pw = document.getElementById('lt-pwd');
            if (!data) return;
            if (!pw || (pw.value !== appState.teacherPassword && pw.value !== data.teacherPassword)) { toast('Code enseignant incorrect.'); if (pw) pw.focus(); return; }
            ltClose();
            if (a === 'merge') syOpenMerge([{ name: 'lien de transfert', data }]);
            else { try { handleRestore(data); } catch (err) { alert('Erreur : ' + err.message); } }
        }
    });
    window.addEventListener('hashchange', ltFromLink);
    setTimeout(ltFromLink, 0);

    // --- lien de transfert en QR code(s) : un seul code si le lien est court, sinon plusieurs liens partiels ---
    const LTQ_CHUNK = 700, LTQ_KEY = 'cqLinkRx';
    let ltqTimer = null;
    function ltqShow(url) {
        const payload = url.slice(url.indexOf('#donnees=') + 9);   // « z.xxxx »
        const f = payload[0], b = payload.slice(2);
        let links;
        if (url.length <= LTQ_CHUNK + 80) links = [url];
        else {
            let hh = 5381; for (let i = 0; i < b.length; i++) hh = ((hh * 33) ^ b.charCodeAt(i)) >>> 0;
            const sid = hh.toString(36).slice(0, 6), n = Math.ceil(b.length / LTQ_CHUNK);
            const sz = Math.ceil(b.length / n);
            links = Array.from({ length: n }, (_, i) => LT_BASE + '#cq=' + sid + '.' + i + '.' + n + '.' + f + '.' + b.slice(i * sz, (i + 1) * sz));
        }
        const svgs = links.map(l => { const q = window.qrcode(0, 'L'); q.addData(l, 'Byte'); q.make(); return q.createSvgTag({ cellSize: 4, margin: 4, scalable: true }); });
        const n = svgs.length;
        syShowModal('ltq-modal', `<h3 class="text-xl font-bold mb-1 font-title">📱 Lien de transfert en QR code${n > 1 ? 's' : ''}</h3><p class="text-sm text-gray-600 mb-2">Sur la tablette, ouvre le scanner de codes et scanne ${n > 1 ? `les <b>${n} codes</b> un par un (▶ pour passer au suivant). La tablette rassemble les morceaux puis demande le code enseignant.` : 'ce code. La tablette ouvre l\'application et demande le code enseignant.'} Luminosité au maximum.</p><div id="ltq-frame" style="background:#fff;padding:6px;border-radius:12px;width:min(94vw,70vh,640px);margin:0 auto;"></div>${n > 1 ? '<div class="flex justify-center items-center gap-3 mt-2"><button data-ltq="prev" class="bg-gray-200 px-4 py-2">◀</button><span id="ltq-count" class="text-lg font-bold"></span><button data-ltq="next" class="bg-gray-200 px-4 py-2">▶</button></div>' : ''}<div class="flex justify-end gap-2 mt-4"><button data-ltq="close" class="bg-gray-300 px-4 py-2">Fermer</button></div>`);
        let k = 0;
        const draw = () => { const box = document.getElementById('ltq-frame'); if (!box) return; box.innerHTML = svgs[k]; const s = box.querySelector('svg'); if (s) { s.style.width = '100%'; s.style.height = 'auto'; s.style.display = 'block'; } const c = document.getElementById('ltq-count'); if (c) c.textContent = 'Code ' + (k + 1) + ' / ' + n; };
        ltqShow.step = d => { k = (k + d + n) % n; draw(); };
        draw(); syMarkTransferred();
    }
    function ltqClose() { const m = document.getElementById('ltq-modal'); if (m) m.remove(); }
    async function ltqFromLink() {
        const m = /[#&]cq=([a-z0-9]+)\.(\d+)\.(\d+)\.([zj])\.([A-Za-z0-9_\-]+)/.exec(location.hash || '');
        if (!m) return;
        try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { }
        const sid = m[1], i = +m[2], n = +m[3], f = m[4];
        let rx = null; try { rx = JSON.parse(localStorage.getItem(LTQ_KEY) || 'null'); } catch (e) { }
        if (!rx || rx.sid !== sid || rx.n !== n) rx = { sid, n, f, parts: {} };
        rx.parts[i] = m[5];
        const got = Object.keys(rx.parts).length;
        if (got < n) {
            try { localStorage.setItem(LTQ_KEY, JSON.stringify(rx)); } catch (e) { }
            const miss = []; for (let j = 0; j < n; j++) if (!(j in rx.parts)) miss.push(j + 1);
            syShowModal('ltq-modal', `<h3 class="text-xl font-bold mb-2 font-title">📥 Code ${i + 1} reçu</h3><div style="height:12px;background:#e5e7eb;border-radius:6px;overflow:hidden;"><div style="height:100%;width:${Math.round(got / n * 100)}%;background:#4f46e5;"></div></div><p class="text-lg font-bold mt-3">${got} / ${n} code(s) reçu(s)</p><p class="text-sm text-gray-700 mt-1">Il manque : <b>${miss.join(', ')}</b>. Retourne dans le scanner et scanne le code suivant.</p><div class="flex justify-between mt-4"><button data-ltq="reset" class="bg-gray-200 px-3 py-2 text-sm">🗑️ Tout recommencer</button><button data-ltq="close" class="bg-gray-300 px-4 py-2">OK</button></div>`);
            return;
        }
        try { localStorage.removeItem(LTQ_KEY); } catch (e) { }
        const b = Array.from({ length: n }, (_, j) => rx.parts[j]).join('');
        let data;
        try { data = JSON.parse(await ltUnpack(f, b)); if (!data || !data.classes) throw new Error('contenu inattendu'); }
        catch (e) { alert('Données illisibles : recommence le scan de tous les codes. (' + e.message + ')'); return; }
        ltqClose(); ltShowChoice(data);
    }
    document.addEventListener('click', e => {
        const b = e.target.closest('[data-ltq]');
        if (!b) { if (e.target.id === 'ltq-modal') ltqClose(); return; }
        const a = b.dataset.ltq;
        if (a === 'show') { const ta = document.getElementById('lt-url'); if (ta) ltqShow(ta.value); }
        else if (a === 'prev') ltqShow.step && ltqShow.step(-1);
        else if (a === 'next') ltqShow.step && ltqShow.step(1);
        else if (a === 'reset') { try { localStorage.removeItem(LTQ_KEY); } catch (e) { } ltqClose(); toast('Réception effacée : rescanne tous les codes.'); }
        else if (a === 'close') ltqClose();
    });
    window.addEventListener('hashchange', ltqFromLink);
    setTimeout(ltqFromLink, 0);

    loadState();
    syInit();
    showScreen('home-screen');
});
</script>
</body>
</html>
