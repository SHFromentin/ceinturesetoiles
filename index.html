    <style>
    body {
        font-family: 'Nunito', 'Inter', sans-serif;
        background: linear-gradient(135deg, #89f7fe 0%, #66a6ff 100%);
        animation: gradient-animation 15s ease infinite;
        background-size: 200% 200%;
    }

    /* === IDENTITÉ VISUELLE === */
    :root{--c-primary:#4f46e5;--c-primary-d:#4338ca;--c-ok:#16a34a;--c-danger:#dc2626;--c-ink:#1e293b;--c-soft:#eef2ff;}
    body{font-family:'Nunito','Inter',system-ui,sans-serif;background:linear-gradient(160deg,#eef2ff 0%,#e0f2fe 100%) fixed !important;animation:none !important;color:var(--c-ink);}
    .font-title{font-family:'Poppins','Nunito',sans-serif;letter-spacing:-.01em;}
    #app-container{background:#fff !important;backdrop-filter:none !important;border-radius:20px;box-shadow:0 10px 40px rgba(30,41,59,.10);border:1px solid #e5e7eb;}
    button{border-radius:10px;font-weight:700;}
    button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #a5b4fc;outline-offset:1px;}
    button:disabled{opacity:.45;cursor:not-allowed;}
    .btn:hover{transform:translateY(-1px) !important;box-shadow:0 6px 16px rgba(30,41,59,.15) !important;}
    button.bg-indigo-600,button.bg-blue-600,button.bg-teal-600,button.bg-purple-600{background:var(--c-primary) !important;color:#fff;}
    button.bg-indigo-600:hover,button.bg-blue-600:hover,button.bg-teal-600:hover,button.bg-purple-600:hover{background:var(--c-primary-d) !important;}
    button.bg-green-500,button.bg-green-600{background:var(--c-ok) !important;color:#fff;}
    button.bg-red-500,button.bg-red-600{background:var(--c-danger) !important;color:#fff;}
    button.bg-orange-500,button.bg-orange-600{background:#ea580c !important;color:#fff;}
    button.bg-gray-200,button.bg-gray-300{background:#e5e7eb !important;color:#374151 !important;}
    button.bg-gray-600,button.bg-gray-700{background:#475569 !important;color:#fff;}
    .home-card{display:flex;align-items:center;gap:16px;width:100%;text-align:left;background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:18px 20px;box-shadow:0 2px 8px rgba(30,41,59,.06);transition:all .18s;color:var(--c-ink);}
    .home-card:hover{border-color:var(--c-primary);box-shadow:0 8px 24px rgba(79,70,229,.18);transform:translateY(-2px);}
    .home-card .hc-ico{width:56px;height:56px;border-radius:14px;background:var(--c-soft);display:flex;align-items:center;justify-content:center;font-size:28px;flex:0 0 auto;}
    .home-card .hc-t{font-size:1.2rem;font-weight:800;font-family:'Poppins','Nunito',sans-serif;}
    .home-card .hc-d{font-size:.9rem;color:#64748b;font-weight:500;}
    /* === TABLEAUX === */
    #teacher-progress-table th,#summary-section th,#registrations-section th{background:#eef2ff !important;color:#3730a3;font-size:.85rem;text-transform:uppercase;letter-spacing:.03em;}
    #teacher-progress-table th,#teacher-progress-table td{border-color:#e5e7eb !important;padding:.6rem .75rem !important;}
    #teacher-progress-table tbody tr:nth-child(even) td[style*="background-color:#FFF"]{background-color:#f8fafc !important;}
    #teacher-progress-table tbody tr:hover td{filter:brightness(.96);}
    #registrations-section tbody tr:nth-child(even){background:#f8fafc;}
    /* === NOTIFICATIONS === */
    #toast-zone{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:3000;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:calc(100% - 24px);max-width:420px;}
    .toast{background:#1e293b;color:#fff;padding:10px 16px;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.25);font-size:.92rem;font-weight:600;opacity:0;transform:translateY(8px);transition:all .25s;text-align:center;}
    .toast.show{opacity:1;transform:none;}
    .btn { transition: all 0.2s ease-in-out; }
    .btn:hover { transform: scale(1.05); box-shadow: 0 8px 25px rgba(0,0,0,0.15); }
    .tab-btn {
        position: relative;
        transition: all 0.2s;
        padding: 0.75rem 1.5rem;
        border-radius: 99px;
        border: 2px solid transparent;
        font-weight: 700;
    }
    .tab-btn.active {
        background-color: #4f46e5;
        color: white;
        box-shadow: 0 4px 14px rgba(79, 70, 229, 0.4);
    }
    .star-choice.selected {
        box-shadow: 0 0 0 4px #4ade80;
        background-color: #4ade80 !important;
        color: white !important;
        font-weight: bold;
    }
    [contenteditable]:focus { outline: 2px solid #6366f1; background-color: #eef2ff; }

    .progress-bar { background-color: rgba(0,0,0,0.1); border-radius: 99px; overflow: hidden; height: 10px; }
    .progress-bar-fill { height: 100%; background: linear-gradient(90deg, #4ade80, #34d399); border-radius: 99px; transition: width 0.5s ease-in-out; }

    @keyframes gradient-animation {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }
    @keyframes confetti-fall { 0% { transform: translateY(-100vh) rotateZ(0deg); opacity: 1;} 100% { transform: translateY(100vh) rotateZ(360deg); opacity: 0;} }
    .confetti { position: fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index: 1000; }
    .confetti-piece { position: absolute; width: 10px; height: 20px; top:-20px; animation: confetti-fall 3s linear infinite; }

    .note-indicator { position: absolute; top: 4px; right: 4px; width: 10px; height: 10px; background-color: #4f46e5; border-radius: 50%; border: 2px solid white; box-shadow: 0 0 5px #4f46e5; }
    .registration-indicator { position: absolute; top: 2px; left: 4px; font-size: 1.1rem; filter: drop-shadow(0 1px 1px rgba(0,0,0,0.3)); }

    #student-dashboard-screen, .student-space-card {
        background: rgba(255, 255, 255, 0.5);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .class-card {
        transition: all 0.3s ease;
        background-size: cover;
        background-position: center;
        position: relative;
        overflow: hidden;
        border: none;
    }
    .class-card:hover {
        transform: translateY(-10px) scale(1.03);
        box-shadow: 0 15px 30px rgba(0,0,0,0.2);
    }
    .class-card-overlay {
        position: absolute; top:0; left:0; right:0; bottom:0;
        background: linear-gradient(to top, rgba(0,0,0,0.7), rgba(0,0,0,0.2));
        transition: background-color 0.3s;
    }
    .class-card:hover .class-card-overlay { background-color: rgba(0,0,0,0.5); }

    .student-select-card {
        background: linear-gradient(120deg, #ffffff 0%, #f1f5f9 100%);
        transition: all 0.2s ease-out;
    }
    .student-select-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        background: white;
    }

    #student-header .text-5xl { font-size: 4.5rem; }

    .challenge-card {
        background: rgba(255, 255, 255, 0.7);
        border-radius: 1.25rem;
        box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        border: 1px solid rgba(255, 255, 255, 0.3);
        transition: all 0.2s;
    }
    .challenge-card:hover { box-shadow: 0 8px 20px rgba(0,0,0,0.1); }

    .challenge-arrow { animation: pulse 1.5s infinite; }

    .challenge-btn {
        font-weight: 700;
        border-radius: 0.75rem;
        border: 2px solid;
        transition: all 0.2s;
        padding: 0.5rem 1rem;
    }
    .challenge-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .challenge-btn.selected {
        transform: scale(1.05);
        border-color: #4ade80;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }
    .star-trophy-card {
        background: white;
        padding: 1rem;
        border-radius: 1rem;
        box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        animation: fadeIn 0.5s ease-out forwards;
        opacity: 0;
    }

    @keyframes pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.15); }
    }

    .pdf-export-container h1 { font-size: 18pt !important; margin-bottom: 20px !important; }
    .pdf-export-container, .pdf-export-container table { font-size: 8pt !important; }
    .pdf-export-container td, .pdf-export-container th { padding: 4px 6px !important; }
    .pdf-export-container .text-2xl { font-size: 14pt !important; }

    .sparkle-shape {
        transform-origin: center;
        animation: sparkle 2s infinite ease-in-out;
    }
    @keyframes sparkle {
        0%, 100% { transform: scale(0); opacity: 0.5; }
        50% { transform: scale(1); opacity: 1; }
    }
    
    </style>

<script>
document.addEventListener('DOMContentLoaded', () => {

    // ===================================
    //      ÉTAT DE L'APPLICATION
    // ===================================
    const DEFAULT_STARS_PALETTE = [
        { id: 's1', name: "Blanc", color: "#FFFFFF" }, { id: 's2', name: "Jaune", color: "#FFEB3B" },
        { id: 's3', name: "Orange", color: "#FFA500" }, { id: 's4', name: "Rose", color: "#FFC0CB" },
        { id: 's5', name: "Vert clair", color: "#90EE90" }, { id: 's6', name: "Vert foncé", color: "#006400" },
        { id: 's7', name: "Bleu clair", color: "#ADD8E6" }, { id: 's8', name: "Bleu foncé", color: "#00008B" },
        { id: 's14', name: "Gris", color: "#9E9E9E" },
        { id: 's9', name: "Violet", color: "#8A2BE2" }, { id: 's10', name: "Marron", color: "#8B4513" },
        { id: 's11', name: "Noire", color: "#000000" }, { id: 's12', name: "Noire 1 étoile", color: "#C0C0C0" },
        { id: 's13', name: "Noire 2 étoiles", color: "#F8C025" }
    ];
    const DEFAULT_AVATARS = ['😀','😎','😂','🥳','🥸','😇','🤠','🤡','👽','🤖','👾','👩‍🚀','👨‍🚀','🦸','🦹','🧙','🧚','🧛','🧜','🧝','🧞','🧟','🐙','🐞','🐢','🐬','🦖','🐳','🦄','🐲','🍀','🍄','⭐','⚡','🔥','💎','👑','🎩','⚽','🏀','🎨','🧪','💻'];
    let appState = {};
    let currentTeacherClassId = null;
    let selectedStudentClassId = null;
    let selectedStudentId = null;
    let selectedDomainForStars = null;
    let cellToUpdate = null;
    let studentViewMode = 'next-tests';
    let classImageToUpdate = null;
    let domainIconToUpdate = null;
    let avatarToUpdate = { context: null, studentId: null };
    let pendingPasswordStudentId = null;
    
    // === GESTIONNAIRE DE DONNÉES (localStorage) ===
    function generateStudentPassword() {
        return String(Math.floor(Math.random() * 10000)).padStart(4, '0');
    }

    window.selectStudent = (studentId) => {
        if (selectedStudentClassId) {
            selectedStudentId = studentId;
            checkForNewStarsAndCelebrate();
        } else {
            console.error("Erreur : ID de classe non sélectionné.");
            alert("Une erreur est survenue. Veuillez retourner choisir votre classe.");
        }
    };

    window.requestStudentPassword = (studentId) => {
        if (!selectedStudentClassId) {
            console.error("Erreur : ID de classe non sélectionné.");
            alert("Une erreur est survenue. Veuillez retourner choisir votre classe.");
            return;
        }
        pendingPasswordStudentId = studentId;
        renderStudentPasswordModal();
    };

    function renderStudentPasswordModal() {
        const modal = document.getElementById('student-password-modal');
        if (!pendingPasswordStudentId) { modal.classList.add('hidden'); modal.style.display = 'none'; return; }
        const cls = appState.classes[selectedStudentClassId];
        const student = cls.students.find(s => s.id === pendingPasswordStudentId);
        modal.innerHTML = `<div class="bg-white rounded-lg shadow-xl p-6 max-w-sm w-full text-center"><h3 class="text-lg font-bold mb-4">Bonjour <span class="text-indigo-600">${student.name}</span> !</h3><p class="text-gray-700 mb-4">Entre ton code à 4 chiffres :</p><input type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" id="student-password-input" class="w-full p-3 border rounded-md mb-4 text-center text-2xl tracking-widest" autofocus><p id="student-password-error" class="text-red-500 mb-2 hidden">Code incorrect.</p><div class="flex justify-center gap-4"><button id="cancel-student-password" class="bg-gray-300 px-4 py-2 rounded-md">Annuler</button><button id="confirm-student-password" class="bg-indigo-600 text-white px-4 py-2 rounded-md">Valider</button></div></div>`;
        modal.classList.remove('hidden');
        modal.style.display = 'flex';
        const input = document.getElementById('student-password-input');
        input.focus();

    function loadState() {

        } catch (err) {
            console.error("Erreur d'accès au stockage local:", err);

        }

        try {
            if (savedState) {
                appState = savedState;
                if (!appState.availableAvatars) { appState.availableAvatars = DEFAULT_AVATARS; }
                Object.values(appState.classes).forEach(cls => {
                    if (typeof cls.icon === 'string' && cls.icon.startsWith('#')) cls.icon = null;
                    if(cls.domains) {
                        cls.domains.forEach(d => {
                            if (d.icon === undefined) d.icon = null;
                            if (d.isVisible === undefined) d.isVisible = true; // NEW: Default domains to visible
                        });
                    }
                    if (cls.students.length > 0 && typeof cls.students[0] === 'string') {
                        const studentNameMap = new Map();
                        cls.students = cls.students.map(name => {
                            const newId = generateId();

                        });
                        const newProgress = {};
                        Object.entries(cls.progress || {}).forEach(([studentName, domains]) => {
                            const newId = studentNameMap.get(studentName);
                            if (newId) newProgress[newId] = domains;
                        });
                        cls.progress = newProgress;
                        cls.registrations.forEach(reg => {
                            const newId = studentNameMap.get(reg.student);
                            if (newId) { reg.studentId = newId; delete reg.student; }
                        });
                    }
                    Object.entries(cls.progress || {}).forEach(([studentId, domains]) => {
                        Object.entries(domains).forEach(([domainId, value]) => {
                            if (typeof value === 'string' || !value.hasOwnProperty('starId')) {
                                cls.progress[studentId][domainId] = { starId: value, note: '', isNew: false };
                            }
                        });
                    });
                });
            } else {
                const student1Id = generateId(), student2Id = generateId(), student3Id = generateId();
                appState = {

                    classes: {

            }
        } catch (err) {
            console.error("Erreur critique lors du chargement des données:", err);
            appState = { teacherPassword: 'prof1234', availableAvatars: DEFAULT_AVATARS, classes: {} };
        }

        let passwordsAssigned = false;
        Object.values(appState.classes || {}).forEach(cls => {
            (cls.students || []).forEach(s => { if (!s.password) { s.password = generateStudentPassword(); passwordsAssigned = true; } });

        if (classIds.length > 0) {

    function isNativeBridgeAvailable() {
        return typeof AppInventor !== 'undefined' && typeof AppInventor.setWebViewString === 'function';
    }

    function persistJSON(jsonString) {
        if (isNativeBridgeAvailable()) {
            AppInventor.setWebViewString(jsonString);
            return;
        }
        localStorage.setItem('starTrackerStateV5', jsonString);
    }

    function readPersistedJSON() {
        if (isNativeBridgeAvailable()) {
            try {
                const fromBridge = AppInventor.getWebViewString();
                if (fromBridge) return fromBridge;
            } catch (e) { /* pont natif indisponible, on retombe sur localStorage */ }
        }
        return localStorage.getItem('starTrackerStateV5');
    }

    function saveState() {
        try {
            persistJSON(JSON.stringify(appState));
        } catch (err) {
            console.error("Erreur de sauvegarde:", err);
            if (!isNativeBridgeAvailable()) {
                alert("Erreur: Impossible d'enregistrer les modifications. Le stockage est peut-être plein.");
            }
        }
    }

    // === MOT DU TITRE (ceintures / étoiles...) ET RAPPEL DE SAUVEGARDE ===
    function titleWords() {
        const t = (appState.appTitle || 'Suivi des ceintures').trim().split(/\s+/);
        const pl = (t[t.length - 1] || 'ceintures').toLowerCase();
        const sg = pl.length > 1 && pl.endsWith('s') ? pl.slice(0, -1) : pl;
        return { pl, sg };
    }
    function caseLike(src, w) { return src[0] === src[0].toUpperCase() && src[0] !== src[0].toLowerCase() ? w[0].toUpperCase() + w.slice(1) : w; }
    function wordT(str) {
        if (typeof str !== 'string' || !/ceinture/i.test(str)) return str;
        const { pl, sg } = titleWords(), vow = /^[aeiouyéèêâîôhàù]/i;
        return str.replace(/\b(ma|ta|sa|Ma|Ta|Sa)(\s+)([Cc]einture)\b/g, (m, a, sp, w) => { const word = caseLike(w, sg); return vow.test(word) ? (a[0] + (a[1] === 'a' ? 'on' : 'on')) + sp + word : m.replace(/[Cc]einture/, word); }).replace(/\b(la|de|La|De)(\s+)([Cc]einture?s?)/g, (m, art, sp, w) => {
            const base = /s$/i.test(w) ? pl : sg, word = caseLike(w, base);
            if (!vow.test(word)) return art + sp + word;
            return (art.toLowerCase() === 'la' ? art[0] + "'" : art[0] + "'") + word;
        }).replace(/ceintures?/gi, w => caseLike(w, /s$/i.test(w) ? pl : sg));
    }
    const _nodeRec = new WeakMap();
    function walkWord(root) {
        if (!root) return;
        const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
        const nodes = []; let n; while ((n = w.nextNode())) nodes.push(n);
        nodes.forEach(t => {
            const par = t.parentElement; if (!par || par.closest('[contenteditable="true"],script,style,textarea')) return;
            const rec = _nodeRec.get(t);
            const orig = rec && t.nodeValue === rec.out ? rec.orig : t.nodeValue;
            const out = wordT(orig);
            if (out !== t.nodeValue) t.nodeValue = out;
            if (out !== orig || rec) _nodeRec.set(t, { orig, out });
        });
        (root.querySelectorAll ? root.querySelectorAll('[placeholder],[title]') : []).forEach(el => {
            ['placeholder', 'title'].forEach(a => {
                if (!el.hasAttribute(a)) return;
                const k = 'data-o-' + a; if (!el.hasAttribute(k)) { if (!/ceinture/i.test(el.getAttribute(a))) return; el.setAttribute(k, el.getAttribute(a)); }
                el.setAttribute(a, wordT(el.getAttribute(k)));
            });
        });
    }
    let _wordBusy = false;
    function applyWord() { if (_wordBusy) return; _wordBusy = true; _wordObs.disconnect(); try { walkWord(document.body); } finally { _wordObs.observe(document.body, { childList: true, subtree: true, characterData: true }); _wordBusy = false; } }
    let _wordTimer = null;

    function printAsPdf(selector, title) {
        const contentToPrint = document.querySelector(selector);
        if (!contentToPrint) {
            alert("Erreur : Impossible de trouver le contenu à imprimer.");
            return;
        }
    
        const printableHTML = `
            <!DOCTYPE html>
            <html lang="fr">
            <head>
                <meta charset="UTF-8">
                <title>${title}</title>
                <style>
                    body { font-family: sans-serif; font-size: 10pt; }
                    h1 { font-size: 18pt; text-align: center; margin-bottom: 20px; }
                    table { width: 100%; border-collapse: collapse; font-size: 8pt !important; }
                    th, td { border: 1px solid #ccc; padding: 4px 6px !important; text-align: left; }
                    th { background-color: #f2f2f2; }
                    .note-indicator, .registration-indicator { display: none; } /* Cacher indicateurs */
                </style>
            </head>
            <body>
                <h1>${title}</h1>
                ${contentToPrint.innerHTML}
            </body>
            </html>
        `;
    
        const blob = new Blob([printableHTML], { type: 'text/html' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = title.replace(/ /g, '_') + '.html';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        alert("Un fichier HTML a été téléchargé. Ouvrez-le et utilisez la fonction 'Imprimer' de votre navigateur pour le sauvegarder en PDF.");
    }

    async function shareDataAsFile(dataToShare, fileName) {
        const jsonString = JSON.stringify(dataToShare, null, 2);
        const blob = new Blob([jsonString], { type: 'application/json' });
        const file = new File([blob], fileName, { type: 'application/json' });

        // Cascade de fallback, comme conseillé
        // 1. Essayer de partager le fichier (le mieux pour mobile)
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
            try {
                await navigator.share({ files: [file], title: fileName, text: `Données: ${fileName}` });
                return; // Succès
            } catch (error) {
                console.warn("Partage de fichier échoué, essai avec texte seul.", error);
            }
        }
    
        // 2. Essayer de partager le texte JSON
        if (navigator.share) {
             try {
                await navigator.share({ text: jsonString, title: fileName });
                return; // Succès
            } catch (error) {
                console.warn("Partage de texte échoué, essai avec presse-papiers.", error);
            }
        }

        // 3. Essayer de copier dans le presse-papiers
        try {
            await navigator.clipboard.writeText(jsonString);
            alert(`Partage non disponible. Les données (${fileName}) ont été copiées dans le presse-papiers.`);
            return;
        } catch (err) {
            console.warn("Copie dans le presse-papiers échoué, déclenchement du téléchargement.", err);
        }
        
        // 4. Dernier recours : téléchargement du fichier
        try {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = fileName;
            a.click();
            URL.revokeObjectURL(url);
        } catch(e) {
             alert('Erreur: Impossible de partager, copier ou télécharger les données.');
        }
    }

    function checkForNewStarsAndCelebrate() {
        const cls = appState.classes[selectedStudentClassId];
        const studentProgress = cls.progress[selectedStudentId] || {};
        const newStars = [];
        Object.entries(studentProgress).forEach(([domainId, progress]) => {
            if (progress.isNew) {
                const domain = cls.domains.find(d => d.id === domainId);
                const star = domain.stars.find(s => s.id === progress.starId);
                if (domain && star) { newStars.push({ domainName: domain.name, starName: star.name, starColor: star.color }); progress.isNew = false; }
            }
        });

        if (newStars.length > 0) {
            saveState();
            const modal = document.getElementById('celebration-modal');
            const student = cls.students.find(s => s.id === selectedStudentId);
            const newStarsHtml = newStars.map(s => `<div class="flex items-center gap-4"><div class="w-8 h-8 rounded-full border" style="background-color: ${s.starColor}"></div><p class="text-lg"><strong>${s.starName}</strong> en ${s.domainName}</p></div>`).join('');

            modal.classList.remove('hidden');
            modal.style.display = 'flex';
            spawnConfetti();
        } else {
            const res = cls.lastResults?.[selectedStudentId];
            if (res && res.fail.length && !res.ok.length && !res.seen) {
                res.seen = true; saveState();
                const student = cls.students.find(x => x.id === selectedStudentId);
                const txt = pickMsg(selectedStudentId + '|' + res.fail.join(','), ENC_FAIL).replace('{d}', res.fail.join(', '));

    function renderTeacherRegistrationModal(studentId) {
        const modal = document.getElementById('teacher-registration-modal');
        const cls = getCurrentClass();
        const student = cls.students.find(s => s.id === studentId);
        if (!student) return;

        const studentRegistrations = cls.registrations.filter(r => r.studentId === studentId);
        const canRegisterCount = 99;

        let availableTestsHtml = '';
        cls.domains.forEach(domain => {
            const progress = cls.progress[studentId]?.[domain.id];
            const currentStarIndex = progress ? domain.stars.findIndex(s => s.id === progress.starId) : -1;
            const nextStar = (currentStarIndex + 1 < domain.stars.length) ? domain.stars[currentStarIndex + 1] : null;

            if (nextStar) {
                const isRegistered = studentRegistrations.some(r => r.domainId === domain.id);
                const buttonDisabled = !isRegistered && canRegisterCount <= 0;

                availableTestsHtml += `
                    <button class="w-full text-left p-3 rounded-lg border-2 flex items-center justify-between transition-all ${isRegistered ? 'border-green-500 bg-green-50' : 'bg-white hover:bg-gray-50'} ${buttonDisabled ? 'opacity-50 cursor-not-allowed' : ''}"

                            data-star-id="${nextStar.id}"

                            ${buttonDisabled ? 'disabled' : ''}>
                        <div>

                            <p class="text-sm text-gray-600">Objectif : ceinture "${nextStar.name}"</p>

            const isProgress = e.target.id === 'export-progress-pdf';

            const element = document.querySelector(elementSelector)?.cloneNode(true);
            
            if (!element) return alert("Erreur: contenu à exporter non trouvé.");

            const opt = {
              margin: 0.5,
              filename: `${isProgress ? 'suivi' : 'inscriptions'}_${cls.name}.pdf`,
              image: { type: 'jpeg', quality: 0.98 },
              html2canvas: { scale: 2, useCORS: true },
              jsPDF: { unit: 'in', format: 'letter', orientation: isProgress ? 'landscape' : 'portrait' }
            };
            const pdfContainer = document.createElement('div');
            pdfContainer.classList.add('pdf-export-container');
            const title = document.createElement('h1');
            title.innerText = titleText;
            pdfContainer.appendChild(title);
            pdfContainer.appendChild(element);
            html2pdf().from(pdfContainer).set(opt).save();
        }
        
        // PDF (Mobile - via impression HTML)
        if (e.target.id === 'print-progress-btn') {

            let data, filename;
            switch(e.target.id) {
                case 'export-students-btn':
                    if (cls.students.length === 0) return alert("Aucun élève à exporter.");
                    data = [...cls.students].sort((a,b)=>a.name.localeCompare(b.name));
                    filename = `eleves_${cls.name}.json`;
                    break;

                    break;
                case 'export-all-data-btn':
                    data = appState;
                    filename = 'sauvegarde_suivi_etoiles.json';
                    break;
            }
            const jsonString = JSON.stringify(data, null, 2);
            const blob = new Blob([jsonString], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a'); a.href = url; a.download = filename; a.click(); URL.revokeObjectURL(url);

        // ==========================================================================
    //  TRANSFERT ENTRE APPAREILS : suivi des modifications, fusion des tablettes,
    //  alertes et copies de sécurité locales
    // ==========================================================================
    const SY_SNAP_KEY = 'starTrackerBackupsV1', SY_SNAP_MAX = 6, SY_SNAP_CAP = 1500000, SY_DEV_KEY = 'starTrackerDeviceName';
    const SY_RANK = { open: 0, seen: 1, done: 2 };
    let sySigs = null, syBaseRest = null, syPrevFull = null, syLastSnapAt = 0, syPending = null, syNoUnloadWarn = false, sySkipOlder = false;

    const syEsc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    const syFmt = t => new Date(t).toLocaleString('fr-FR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
    function syAgo(t) {
        if (!t) return 'jamais';
        const m = Math.round((Date.now() - t) / 60000);
        if (m < 1) return "à l'instant";
        if (m < 60) return 'il y a ' + m + ' min';
        const h = Math.round(m / 60);
        if (h < 24) return 'il y a ' + h + ' h';
        return 'il y a ' + Math.round(h / 24) + ' j';
    }
    function syEnsure() {
        if (!appState.sync) appState.sync = { lastModified: 0, lastTransfer: 0, changes: 0 };
        return appState.sync;
    }
    function syDevNameRaw() { try { return localStorage.getItem(SY_DEV_KEY) || ''; } catch (e) { return ''; } }
    function syDevName() {
        const n = syDevNameRaw().normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim().replace(/[^\w-]+/g, '-').replace(/^-+|-+$/g, '');
        return n || 'appareil';
    }

    // --- signatures par élève (pour horodater chaque élève modifié) ---
    function syStudentSig(cls, st) {
        const regs = (cls.registrations || []).filter(r => r.studentId === st.id).map(r => r.domainId + ':' + r.starId).sort();
        const helps = (cls.helpRequests || []).filter(h => h.studentId === st.id).map(h => h.id + ':' + h.status).sort();
        return JSON.stringify([st.name, st.avatar, st.password, regs, helps]);
    }
    function syMergeSig(cls, st) {
        const regs = (cls.registrations || []).filter(r => r.studentId === st.id).map(r => r.domainId + ':' + r.starId).sort();
        const helps = (cls.helpRequests || []).filter(h => h.studentId === st.id).map(h => h.id + ':' + h.status).sort();
        return JSON.stringify([st.avatar, regs, helps]);
    }
    function syComputeSigs() {
        const m = {};
        Object.entries(appState.classes || {}).forEach(([cid, cls]) => (cls.students || []).forEach(st => { m[cid + '|' + st.id] = syStudentSig(cls, st); }));
        return m;
    }
    function syRestStr() {
        return JSON.stringify(appState, function (k, v) { return (this === appState && (k === 'sync' || k === 'lastBackup')) ? undefined : v; });
    }
    function syBaseline() {
        sySigs = syComputeSigs(); syBaseRest = syRestStr(); syPrevFull = JSON.stringify(appState);
    }

    // --- copies de sécurité locales ---
    function syReadSnaps() { try { return JSON.parse(localStorage.getItem(SY_SNAP_KEY) || '[]'); } catch (e) { return []; } }
    function syWriteSnaps(list) {
        try {
            while (list.length > SY_SNAP_MAX) list.shift();
            while (list.length > 1 && list.reduce((a, x) => a + x.data.length, 0) > SY_SNAP_CAP) list.shift();
            localStorage.setItem(SY_SNAP_KEY, JSON.stringify(list));
            return true;
        } catch (e) {
            try { localStorage.removeItem(SY_SNAP_KEY); } catch (_) { }
            return false;
        }
    }
    function syPushSnapshot(data, label) {
        if (!data || data.length > SY_SNAP_CAP) return false;
        const list = syReadSnaps();
        if (list.length && list[list.length - 1].data === data) return true;
        list.push({ t: Date.now(), label, data });
        const ok = syWriteSnaps(list);
        if (ok) syLastSnapAt = Date.now();
        return ok;
    }
    function sySnapshotNow(label) { try { return syPushSnapshot(JSON.stringify(appState), label); } catch (e) { return false; } }
    // localStorage.clear() (bouton « Réinitialiser l'App ») ne doit pas effacer les copies de sécurité
    try {
        const _clear = Storage.prototype.clear;
        Storage.prototype.clear = function () {
            if (this === window.localStorage) {
                let b = null, d = null;
                try { b = localStorage.getItem(SY_SNAP_KEY); d = localStorage.getItem(SY_DEV_KEY); } catch (e) { }
                _clear.call(this);
                try { if (b) localStorage.setItem(SY_SNAP_KEY, b); if (d) localStorage.setItem(SY_DEV_KEY, d); } catch (e) { }
            } else { _clear.call(this); }
        };
    } catch (e) { }

    // --- enveloppe de saveState : compte les modifications et horodate chaque élève ---
    const _sySave = saveState;
    saveState = function () {
        if (!appState || !appState.classes) { return _sySave(); }
        const s = syEnsure();
        if (syBaseRest === null) { syBaseline(); return _sySave(); }
        const now = Date.now();
        Object.entries(appState.classes).forEach(([cid, cls]) => {
            cls.studentMeta = cls.studentMeta || {};
            (cls.students || []).forEach(st => {
                const k = cid + '|' + st.id, sg = syStudentSig(cls, st);
                if (sySigs[k] !== sg) cls.studentMeta[st.id] = now;
                sySigs[k] = sg;
            });
        });
        const r = syRestStr();
        if (r !== syBaseRest) {
            if (syPrevFull && now - syLastSnapAt > 15 * 60000) syPushSnapshot(syPrevFull, 'automatique');
            s.changes = (s.changes || 0) + 1; s.lastModified = now; syBaseRest = r;
            syPrevFull = JSON.stringify(appState);
        }
        _sySave();
        syRender();
    };
    function syMarkTransferred() {
        const s = syEnsure(); s.lastTransfer = Date.now(); s.changes = 0; appState.lastBackup = Date.now();
        _sySave(); syRender();
        try { renderBackupBanner(); } catch (e) { }
    }

    // --- bandeaux et état ---
    function syRender() {
        if (!appState || !appState.classes) return;
        const s = syEnsure(), n = s.changes || 0;
        const last = s.lastTransfer ? syFmt(s.lastTransfer) + ' (' + syAgo(s.lastTransfer) + ')' : 'jamais';
        const btn = '<button data-sync="transfer" style="background:#4f46e5;color:#fff;padding:4px 12px;">📤 Transférer</button>';
        const box = 'padding:8px 12px;border-radius:8px;margin:0 0 12px;font-size:14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;';
        const warn = n ? `<div style="background:#fef3c7;border:1px solid #f59e0b;color:#92400e;${box}"><span>⚠️ <b>${n}</b> modification${n > 1 ? 's' : ''} non transférée${n > 1 ? 's' : ''} · dernier transfert : ${last}</span>${btn}</div>` : '';
        const ok = `<div style="background:#ecfdf5;border:1px solid #6ee7b7;color:#065f46;${box}font-size:13px;"><span>✓ Rien à transférer · dernier transfert : ${last}</span>${btn}</div>`;
        const h = document.getElementById('sy-banner-home'); if (h) h.innerHTML = warn;
        const t = document.getElementById('sy-banner-teacher'); if (t) t.innerHTML = warn || ok;
        const st = document.getElementById('sy-status'); if (st) st.innerHTML = n ? `⚠️ <b>${n}</b> modification(s) non transférée(s) · dernier transfert : ${last}` : `✓ Rien à transférer · dernier transfert : ${last}`;
    }
    function syRenderSnaps() {
        const el = document.getElementById('sy-snaps'); if (!el) return;
        const list = syReadSnaps().slice().reverse();
        el.innerHTML = list.length ? list.map(x => `<div class="flex items-center justify-between gap-2 py-1 border-t text-sm"><span>${syFmt(x.t)} · ${syEsc(x.label)} <span class="text-gray-400">(${Math.round(x.data.length / 1024)} Ko)</span></span><button data-sync-restore="${x.t}" class="bg-gray-200 text-xs py-1 px-2">Restaurer</button></div>`).join('') : '<p class="text-sm text-gray-500 italic">Aucune copie pour le moment.</p>';
    }

    // --- bouton Transférer ---
    async function syTransfer() {
        const d = new Date(), p = x => String(x).padStart(2, '0');
        const name = `suivi_${syDevName()}_${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}_${p(d.getHours())}h${p(d.getMinutes())}.json`;
        const json = JSON.stringify(appState, null, 2);
        let file = null; try { file = new File([json], name, { type: 'application/json' }); } catch (e) { }
        if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
            try {
                await navigator.share({ files: [file], title: name, text: 'Données Suivi des ceintures' });
                syMarkTransferred(); toast('✅ Transfert effectué'); return;
            } catch (err) {
                if (err && err.name === 'AbortError') { toast('Transfert annulé : les modifications restent non transférées.'); return; }
            }
        }
        try {
            const url = URL.createObjectURL(new Blob([json], { type: 'application/json' }));
            const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); document.body.removeChild(a);
            setTimeout(() => URL.revokeObjectURL(url), 2000);
            syMarkTransferred(); toast("📥 Fichier enregistré dans les Téléchargements : envoie-le sur l'autre appareil.", 6000);
        } catch (e) {
            try { await navigator.clipboard.writeText(json); syMarkTransferred(); toast('📋 Données copiées : colle-les sur l\'autre appareil (Restaurer via Copier/Coller).', 6000); }
            catch (e2) { toast("Impossible de partager ou copier les données."); }
        }
    }

    // --- restauration : avertissement si le fichier est plus ancien + copie de sécurité ---
    const _syHandleRestore = handleRestore;
    handleRestore = function (imported) {
        const prev = Object.assign({}, syEnsure());
        const fromSnap = sySkipOlder;
        if (!fromSnap && imported && imported.classes) {
            const a = (imported.sync && imported.sync.lastModified) || 0, b = prev.lastModified || 0;
            if (a && b && a < b && !confirm("⚠️ Ce fichier est plus ancien que les données de cet appareil.\n\nFichier : " + syFmt(a) + "\nCet appareil : " + syFmt(b) + "\n\nLa restauration écrasera les données les plus récentes. Continuer ?")) return;
            if (!a && b && !confirm("⚠️ Ce fichier n'a pas de date (ancienne sauvegarde) : impossible de savoir s'il est plus ancien que les données de cet appareil.\n\nContinuer la restauration ?")) return;
        }
        if (imported && imported.classes) sySnapshotNow('avant restauration');
        _syHandleRestore(imported);
        if (appState === imported) {
            const s = syEnsure();
            if (fromSnap) { s.lastModified = Date.now(); s.lastTransfer = prev.lastTransfer || 0; s.changes = (prev.changes || 0) + 1; }
            else { s.lastModified = (imported.sync && imported.sync.lastModified) || Date.now(); s.lastTransfer = Date.now(); s.changes = 0; }
            syBaseline(); _sySave(); syRender();
        }
    };
    function syRestoreSnap(t) {
        const snap = syReadSnaps().find(x => x.t === t); if (!snap) return;
        let data; try { data = JSON.parse(snap.data); } catch (e) { toast('Copie illisible.'); return; }
        sySkipOlder = true;
        try { handleRestore(data); } catch (err) { alert('Erreur : ' + err.message); } finally { sySkipOlder = false; }
        syRenderSnaps(); syRender();
    }

    // --- copie de sécurité avant « Fin de session » + rappel de fusion ---

    const _syResetModal = renderResetConfirmModal;
    renderResetConfirmModal = function () {

            "Avant la fin de session : as-tu fusionné les données de TOUTES les tablettes ? Les inscriptions restées sur les tablettes seraient perdues.\n\nContinuer ?";

    // --- fusion des tablettes ---
    function syPlanMerge(files) {
        const work = JSON.parse(JSON.stringify(appState));
        const rep = { files: [], classes: {}, warnings: [], students: 0, regAdd: 0, regDel: 0, helpAdd: 0, avatars: 0, unknown: 0 };
        const touched = {};
        files.forEach(f => {
            const d = f.data;
            if (!d || typeof d !== 'object' || !d.classes || typeof d.classes !== 'object') { rep.warnings.push(`« ${syEsc(f.name)} » n'est pas un fichier de sauvegarde de l'appli : ignoré.`); return; }
            rep.files.push(f.name);
            Object.entries(d.classes).forEach(([cid, src]) => {
                const dst = work.classes[cid];
                if (!dst) { rep.warnings.push(`Classe « ${syEsc(src.name || cid)} » absente de cet appareil : ignorée.`); return; }
                dst.studentMeta = dst.studentMeta || {}; dst.registrations = dst.registrations || []; dst.helpRequests = dst.helpRequests || [];
                const sm = src.studentMeta || {};
                const cr = rep.classes[cid] || (rep.classes[cid] = { name: dst.name, lines: [] });
                (src.students || []).forEach(sst => {
                    const dstu = (dst.students || []).find(x => x.id === sst.id);
                    if (!dstu) { rep.unknown++; return; }
                    const key = cid + '|' + sst.id;
                    // les ceintures vues par l'élève sur la tablette ne reviennent plus en « nouveauté »
                    const sp = (src.progress || {})[sst.id], dp = (dst.progress || {})[sst.id];
                    if (sp && dp) Object.keys(sp).forEach(did => { if (dp[did] && sp[did] && sp[did].isNew === false && dp[did].isNew === true && sp[did].starId === dp[did].starId) dp[did].isNew = false; });
                    const sl = (src.lastResults || {})[sst.id], dl = (dst.lastResults || {})[sst.id];
                    if (sl && dl && sl.seen && JSON.stringify(sl.fail) === JSON.stringify(dl.fail) && JSON.stringify(sl.ok) === JSON.stringify(dl.ok)) dl.seen = true;

                    const tsS = sm[sst.id] || 0, tsD = dst.studentMeta[sst.id] || 0;
                    const differs = syMergeSig(src, sst) !== syMergeSig(dst, dstu);
                    if (touched[key] && differs) rep.warnings.push(`${syEsc(dstu.name)} : modifié(e) dans plusieurs fichiers, la version la plus récente est conservée.`);
                    if (tsS <= tsD || !differs) { if (tsS > tsD) dst.studentMeta[sst.id] = tsS; return; }

                    const oldRegs = dst.registrations.filter(r => r.studentId === sst.id);
                    const newRegs = (src.registrations || []).filter(r => r.studentId === sst.id).filter(r => { const dm = dst.domains.find(x => x.id === r.domainId); return dm && dm.stars.some(x => x.id === r.starId); });
                    const kk = r => r.domainId + '|' + r.starId;
                    const oldK = new Set(oldRegs.map(kk)), newK = new Set(newRegs.map(kk));
                    const add = [...newK].filter(x => !oldK.has(x)).length, del = [...oldK].filter(x => !newK.has(x)).length;
                    dst.registrations = dst.registrations.filter(r => r.studentId !== sst.id).concat(newRegs.map(r => ({ studentId: r.studentId, domainId: r.domainId, starId: r.starId })));

                    const dh = dst.helpRequests.filter(h => h.studentId === sst.id), sh = (src.helpRequests || []).filter(h => h.studentId === sst.id);
                    const merged = []; let hAdd = 0;
                    sh.forEach(h => { const o = dh.find(x => x.id === h.id); if (!o) { merged.push(h); hAdd++; } else { merged.push((SY_RANK[o.status] || 0) > (SY_RANK[h.status] || 0) ? o : Object.assign({}, h)); } });
                    dh.forEach(o => { if (!sh.some(h => h.id === o.id) && o.status !== 'open') merged.push(o); });
                    dst.helpRequests = dst.helpRequests.filter(h => h.studentId !== sst.id).concat(merged);

                    let av = false;
                    if (sst.avatar && sst.avatar !== dstu.avatar) { dstu.avatar = sst.avatar; av = true; }
                    dst.studentMeta[sst.id] = tsS; touched[key] = true;
                    if (add || del || hAdd || av) {
                        rep.students++; rep.regAdd += add; rep.regDel += del; rep.helpAdd += hAdd; if (av) rep.avatars++;
                        const parts = [];
                        if (add) parts.push('+' + add + ' inscription(s)');
                        if (del) parts.push('−' + del + ' inscription(s)');
                        if (hAdd) parts.push(hAdd + " demande(s) d'aide");
                        if (av) parts.push('avatar');
                        cr.lines.push(`<li><b>${syEsc(dstu.name)}</b> : ${parts.join(', ')}</li>`);
                    }
                });
            });
        });
        return { work, rep };
    }
    function syShowModal(id, inner) {
        const old = document.getElementById(id); if (old) old.remove();
        document.body.insertAdjacentHTML('beforeend', `<div id="${id}" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-3"><div class="bg-white rounded-2xl shadow-xl p-5 w-full max-w-xl max-h-[90vh] overflow-y-auto">${inner}</div></div>`);
        applyWord();
    }
    function syCloseModals() {
        ['sy-merge-modal', 'sy-paste-modal'].forEach(id => { const m = document.getElementById(id); if (m) m.remove(); });
        syPending = null;
    }
    function syOpenMerge(files) {
        const plan = syPlanMerge(files); syPending = plan;
        const r = plan.rep, nothing = !r.students;
        const classes = Object.values(r.classes).filter(c => c.lines.length).map(c => `<h4 class="font-bold mt-3">${syEsc(c.name)}</h4><ul class="text-sm space-y-1" style="list-style:disc;padding-left:1.2rem;">${c.lines.join('')}</ul>`).join('');
        const warns = r.warnings.length || r.unknown ? `<div class="mt-3 p-2 rounded-md bg-amber-50 border border-amber-300 text-sm">${r.warnings.map(w => '⚠️ ' + w).join('<br>')}${r.unknown ? (r.warnings.length ? '<br>' : '') + 'ℹ️ ' + r.unknown + ' élève(s) inconnu(s) de cet appareil ignoré(s).' : ''}</div>` : '';
        const summary = nothing
            ? '<p class="text-gray-600 italic">Rien à fusionner : ce fichier ne contient aucune modification plus récente que les données de cet appareil.</p>'
            : `<p class="font-semibold mb-1">${r.students} élève(s) mis à jour · ${r.regAdd} inscription(s) ajoutée(s) · ${r.regDel} retirée(s) · ${r.helpAdd} demande(s) d'aide${r.avatars ? ' · ' + r.avatars + ' avatar(s)' : ''}</p>${classes}`;
        syShowModal('sy-merge-modal', `<div class="flex justify-between items-center mb-3"><h3 class="text-2xl font-bold font-title">🔀 Fusion des tablettes</h3></div><p class="text-sm text-gray-500 mb-2">Fichier(s) analysé(s) : ${r.files.length ? r.files.map(syEsc).join(', ') : 'aucun'}</p>${summary}${warns}<p class="text-xs text-gray-500 mt-3">Les ceintures, domaines et historique de cet appareil ne sont pas modifiés. Une copie de sécurité est créée avant la fusion.</p><div class="flex justify-end gap-2 mt-4"><button data-sync="merge-cancel" class="bg-gray-300 px-4 py-2">${nothing ? 'Fermer' : 'Annuler'}</button>${nothing ? '' : '<button data-sync="merge-apply" class="bg-indigo-600 text-white px-4 py-2">Fusionner</button>'}</div>`);
    }
    function syApplyMerge() {
        if (!syPending) return;
        const { work, rep } = syPending;
        sySnapshotNow('avant fusion');
        appState = work; syPending = null;
        saveState();
        ['sy-merge-modal'].forEach(id => { const m = document.getElementById(id); if (m) m.remove(); });
        toast(`✅ Fusion terminée : ${rep.students} élève(s), ${rep.regAdd} inscription(s) ajoutée(s)`, 5000);
        try { renderSettingsSection(); } catch (e) { }
    }
    function syOpenPaste() {
        syShowModal('sy-paste-modal', `<h3 class="text-xl font-bold mb-2 font-title">📋 Fusion via copier/coller</h3><p class="text-sm text-gray-600 mb-2">Colle ici le contenu complet du fichier d'une tablette (une tablette à la fois).</p><textarea id="sy-paste-text" class="w-full h-40 p-2 border rounded-md font-mono text-xs"></textarea><div class="flex justify-end gap-2 mt-3"><button data-sync="merge-cancel" class="bg-gray-300 px-4 py-2">Annuler</button><button data-sync="paste-analyze" class="bg-indigo-600 text-white px-4 py-2">Analyser</button></div>`);
    }
    function syAnalyzePaste() {
        const t = (document.getElementById('sy-paste-text') || {}).value || '';
        let data = null; try { data = JSON.parse(t.trim()); } catch (e) { toast('Texte invalide : colle le fichier JSON en entier.'); return; }
        syCloseModals(); syOpenMerge([{ name: 'texte collé', data }]);
    }

    // --- interface : paramètres, aide, bandeaux ---
    const _syRenderSet = renderSettingsSection;
    renderSettingsSection = function () {
        _syRenderSet();
        document.getElementById('settings-section').insertAdjacentHTML('afterbegin', `<div class="mb-6 p-4 border rounded-lg bg-indigo-50"><h3 class="text-xl font-bold mb-1 font-title">🔄 Transfert entre appareils</h3><p class="text-sm text-gray-600 mb-2">Smartphone ⇄ tablettes, sans serveur : <b>Transférer</b> envoie les données de cet appareil ; <b>Fusionner</b> récupère les inscriptions faites sur une tablette sans toucher aux ceintures.</p><div id="sy-status" class="text-sm mb-3"></div><label class="text-sm block mb-3">Nom de cet appareil (utilisé dans le nom des fichiers) <input type="text" id="sy-device-name" maxlength="30" value="${syEsc(syDevNameRaw())}" placeholder="Tablette 1" class="p-1 border rounded-md ml-1"></label><div class="flex flex-wrap gap-2 mb-4"><button data-sync="transfer" class="bg-indigo-600 text-white py-2 px-4">📤 Transférer</button><button data-sync="merge-file" class="bg-green-500 text-white py-2 px-4">🔀 Fusionner des tablettes (fichiers)</button><button data-sync="merge-paste" class="bg-gray-600 text-white py-2 px-4">📋 Fusionner (copier/coller)</button></div><div class="flex flex-wrap gap-2 mb-4"><button data-qr="send" class="bg-purple-600 text-white py-2 px-4">📱 Envoyer par QR codes</button><button data-qr="receive" class="bg-purple-100 text-purple-900 py-2 px-4">📷 Recevoir par caméra</button></div><p class="text-xs text-gray-500 -mt-2 mb-4">Sans fichier ni copier/coller (mode enfant) : un appareil affiche des QR codes, l'autre les lit avec sa caméra.</p><h4 class="font-semibold mb-1">🛟 Copies de sécurité automatiques (sur cet appareil)</h4><p class="text-xs text-gray-500 mb-2">Gardées localement : à chaque restauration, fusion ou fin de session, puis environ toutes les 15 minutes de modifications. Elles restent sur cet appareil et ne remplacent pas le transfert.</p><div id="sy-snaps"></div><button data-sync="snap-now" class="bg-gray-200 text-sm py-1 px-3 mt-2">Créer une copie maintenant</button></div>`);
        syRender(); syRenderSnaps(); applyWord();
    };
    HELP_TABS['settings-section'][1].push("<b>🔄 Transfert entre appareils</b> : « Transférer » partage les données de cet appareil. « Fusionner des tablettes » récupère les inscriptions et demandes d'aide des tablettes sans toucher aux ceintures. Fais la fusion AVANT « Fin de session ». Les copies de sécurité locales permettent de revenir en arrière.");
    const _syShowScreen = showScreen;
    showScreen = function (id) { _syShowScreen(id); syRender(); };

    document.addEventListener('change', e => { if (e.target.id === 'sy-device-name') { try { localStorage.setItem(SY_DEV_KEY, e.target.value.trim()); } catch (err) { } } });
    document.addEventListener('click', e => {
        const b = e.target.closest('[data-sync]');
        if (b) {
            const a = b.dataset.sync;
            if (a === 'transfer') syTransfer();
            else if (a === 'merge-file') { const i = document.getElementById('sy-merge-input'); if (i) i.click(); }
            else if (a === 'merge-paste') syOpenPaste();
            else if (a === 'merge-apply') syApplyMerge();
            else if (a === 'merge-cancel') syCloseModals();
            else if (a === 'paste-analyze') syAnalyzePaste();
            else if (a === 'snap-now') { toast(sySnapshotNow('manuelle') ? '🛟 Copie créée' : 'Données trop volumineuses pour une copie locale.'); syRenderSnaps(); }
        }
        const r = e.target.closest('[data-sync-restore]');
        if (r && confirm('Restaurer cette copie de sécurité ? Les données actuelles seront remplacées (une copie des données actuelles est créée avant).')) syRestoreSnap(Number(r.dataset.syncRestore));
        if (e.target.id === 'sy-merge-modal' || e.target.id === 'sy-paste-modal') syCloseModals();
        if (['copy-all-data-btn', 'export-all-data-btn', 'share-all-data-btn'].includes(e.target.id)) setTimeout(syMarkTransferred, 600);
    });
    // alerte à la déconnexion enseignant et copie avant réinitialisation (phase de capture : avant les autres écouteurs)
    document.addEventListener('click', e => {
        if (e.target.closest('#logout-btn')) {
            const s = syEnsure(), n = s.changes || 0;
            if (n > 0 && !confirm('⚠️ ' + n + ' modification(s) non transférée(s) (dernier transfert : ' + (s.lastTransfer ? syFmt(s.lastTransfer) : 'jamais') + ").\n\nTe déconnecter quand même ? (Annuler pour revenir et utiliser « Transférer »)")) { e.stopImmediatePropagation(); e.preventDefault(); }
        }
        if (e.target.id === 'reset-all-data-btn') { sySnapshotNow('avant réinitialisation'); syNoUnloadWarn = true; setTimeout(() => { syNoUnloadWarn = false; }, 2500); }
    }, true);
    window.addEventListener('beforeunload', e => {
        if (syNoUnloadWarn || !appState || !appState.sync) return;
        if ((appState.sync.changes || 0) > 0) { e.preventDefault(); e.returnValue = ''; }
    });

    function syInit() {
        syEnsure(); syBaseline();
        const l = syReadSnaps(); syLastSnapAt = l.length ? l[l.length - 1].t : 0;
        const row = document.querySelector('#home-screen .space-y-6');
        if (row) row.insertAdjacentHTML('beforebegin', '<div id="sy-banner-home" class="max-w-md mx-auto mb-6 text-left"></div>');
        document.getElementById('teacher-view').insertAdjacentHTML('afterbegin', '<div id="sy-banner-teacher"></div>');
        document.body.insertAdjacentHTML('beforeend', '<input type="file" id="sy-merge-input" class="hidden" accept=".json,application/json" multiple>');
        document.getElementById('sy-merge-input').addEventListener('change', async e => {
            const files = [...e.target.files]; if (!files.length) return;
            const out = [];
            for (const f of files) { try { out.push({ name: f.name, data: JSON.parse(await f.text()) }); } catch (err) { out.push({ name: f.name, data: null }); } }
            e.target.value = ''; syOpenMerge(out);
        });
        setInterval(syRender, 60000);
        syRender();
    }

    // === TRANSFERT PAR QR CODES (caméra) : pour les appareils sans fichiers ni copier/coller (mode enfant) ===
    const QR_CHUNK = 550;
    let qrSendTimer = null, qrStream = null, qrScanOn = false, qrRx = null;
    function qrLoad(src, test) {
        return new Promise((ok, ko) => {
            if (test()) return ok();
            const s = document.createElement('script'); s.src = src; s.onload = () => test() ? ok() : ko(new Error('lib')); s.onerror = () => ko(new Error('réseau'));
            document.head.appendChild(s);
        });
    }
    function qrB64(bytes) { let s = ''; for (let i = 0; i < bytes.length; i += 8192) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 8192)); return btoa(s); }
    function qrUnB64(b) { const s = atob(b), u = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return u; }
    async function qrPack(text) {
        const raw = new TextEncoder().encode(text);
        if (typeof CompressionStream !== 'undefined') {
            try { const buf = await new Response(new Blob([raw]).stream().pipeThrough(new CompressionStream('deflate-raw'))).arrayBuffer(); return { f: 'z', b: qrB64(new Uint8Array(buf)) }; } catch (e) { }
        }
        return { f: 'j', b: qrB64(raw) };
    }
    async function qrUnpack(f, b) {
        const bytes = qrUnB64(b);
        if (f === 'z') {
            if (typeof DecompressionStream === 'undefined') throw new Error("Ce navigateur ne sait pas décompresser les données.");
            return await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text();
        }
        return new TextDecoder().decode(bytes);
    }
    function qrStopAll() {
        clearInterval(qrSendTimer); qrSendTimer = null; qrScanOn = false;
        if (qrStream) { qrStream.getTracks().forEach(t => t.stop()); qrStream = null; }
        const m = document.getElementById('qr-modal'); if (m) m.remove();
    }

    // --- envoi : affiche les QR codes en boucle ---
    async function qrSend() {
        try { await qrLoad('https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js', () => typeof window.qrcode === 'function'); }
        catch (e) { toast("Impossible de charger l'outil QR : vérifie la connexion internet.", 6000); return; }
        const { f, b } = await qrPack(JSON.stringify(appState));
        const sid = Math.random().toString(36).slice(2, 6), n = Math.max(1, Math.ceil(b.length / QR_CHUNK));
        const frames = [];
        for (let i = 0; i < n; i++) {
            const q = window.qrcode(0, 'L'); q.addData('CQ1|' + sid + '|' + i + '|' + n + '|' + f + '|' + b.slice(i * QR_CHUNK, (i + 1) * QR_CHUNK), 'Byte'); q.make();
            frames.push(q.createSvgTag({ cellSize: 4, margin: 4, scalable: true }));
        }
        syShowModal('qr-modal', `<h3 class="text-xl font-bold mb-1 font-title">📱 Envoyer par QR codes</h3><p class="text-sm text-gray-600 mb-3">Sur l'autre appareil : Paramètres → <b>📷 Recevoir par caméra</b>, puis vise cet écran. Les ${n} code(s) défilent en boucle : garde l'appareil en face jusqu'à la fin de la réception.</p><div id="qr-frame" style="background:#fff;padding:8px;border-radius:12px;width:min(80vw,62vh,520px);margin:0 auto;"></div><p id="qr-count" class="text-center text-sm text-gray-600 mt-2"></p><div class="flex flex-wrap justify-center gap-2 mt-3"><button data-qr="slower" class="bg-gray-200 px-3 py-2">🐢 Plus lent</button><button data-qr="faster" class="bg-gray-200 px-3 py-2">🐇 Plus rapide</button></div><div class="flex justify-end gap-2 mt-4"><button data-qr="close" class="bg-gray-300 px-4 py-2">Annuler</button><button data-qr="sent" class="bg-indigo-600 text-white px-4 py-2">✅ C'est reçu</button></div>`);
        const box = document.getElementById('qr-frame'), cnt = document.getElementById('qr-count');
        let k = 0, delay = 450;
        const show = () => { box.innerHTML = frames[k]; const svg = box.querySelector('svg'); if (svg) { svg.style.width = '100%'; svg.style.height = 'auto'; svg.style.display = 'block'; } cnt.textContent = 'Code ' + (k + 1) + ' / ' + n; k = (k + 1) % n; };
        const start = () => { clearInterval(qrSendTimer); if (n > 1) qrSendTimer = setInterval(show, delay); };
        show(); start();
        qrSend.speed = (fac) => { delay = Math.min(2000, Math.max(200, Math.round(delay * fac))); start(); toast('Vitesse : ' + (1000 / delay).toFixed(1) + ' code(s)/s'); };
    }

    // --- réception : lit les QR codes avec la caméra ---
    async function qrReceive() {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { toast("Ce navigateur n'a pas accès à la caméra.", 6000); return; }
        const native = 'BarcodeDetector' in window;
        let detector = null;
        if (native) { try { const fm = await BarcodeDetector.getSupportedFormats(); if (fm.includes('qr_code')) detector = new BarcodeDetector({ formats: ['qr_code'] }); } catch (e) { } }
        if (!detector) {
            try { await qrLoad('https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js', () => typeof window.jsQR === 'function'); }
            catch (e) { toast("Impossible de charger le lecteur QR : vérifie la connexion internet.", 6000); return; }
        }
        syShowModal('qr-modal', `<h3 class="text-xl font-bold mb-1 font-title">📷 Recevoir par caméra</h3><p class="text-sm text-gray-600 mb-3">Sur l'appareil qui envoie : Paramètres → <b>📱 Envoyer par QR codes</b>. Vise les codes qui défilent, à 20–30 cm.</p><video id="qr-video" playsinline muted style="width:100%;max-height:55vh;background:#000;border-radius:12px;object-fit:cover;"></video><div style="height:10px;background:#e5e7eb;border-radius:6px;margin-top:10px;overflow:hidden;"><div id="qr-bar" style="height:100%;width:0;background:#4f46e5;transition:width .2s;"></div></div><p id="qr-status" class="text-center text-sm text-gray-600 mt-2">En attente d'un code…</p><div class="flex justify-end gap-2 mt-4"><button data-qr="close" class="bg-gray-300 px-4 py-2">Annuler</button></div>`);
        const video = document.getElementById('qr-video');
        try { qrStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false }); }
        catch (e) { qrStopAll(); alert("La caméra n'est pas accessible (" + (e && e.name || 'erreur') + ").\n\nAutorise la caméra pour ce site dans le navigateur, ou dans le contrôle parental si tu es en mode enfant."); return; }
        video.srcObject = qrStream; try { await video.play(); } catch (e) { }
        qrRx = { sid: null, n: 0, f: 'j', parts: {} };
        qrScanOn = true;
        const cv = document.createElement('canvas'), cx = cv.getContext('2d', { willReadFrequently: true });
        let busy = false, last = 0;
        const handle = (txt) => {
            const m = /^CQ1\|([a-z0-9]+)\|(\d+)\|(\d+)\|([zj])\|([\s\S]*)$/.exec(txt || ''); if (!m) return;
            const [, sid, i, n, f, part] = m;
            if (qrRx.sid !== sid) qrRx = { sid, n: +n, f, parts: {} };
            qrRx.parts[i] = part;
            const got = Object.keys(qrRx.parts).length;
            document.getElementById('qr-bar').style.width = Math.round(got / qrRx.n * 100) + '%';
            document.getElementById('qr-status').textContent = got + ' / ' + qrRx.n + ' code(s) reçu(s)';
            if (got === qrRx.n) qrDone();
        };
        const tick = async (t) => {
            if (!qrScanOn) return;
            requestAnimationFrame(tick);
            if (busy || t - last < 110 || video.readyState < 2) return;
            busy = true; last = t;
            try {
                if (detector) { const codes = await detector.detect(video); codes.forEach(c => handle(c.rawValue)); }
                else {
                    const w = Math.min(800, video.videoWidth), h = Math.round(video.videoHeight * w / video.videoWidth);
                    cv.width = w; cv.height = h; cx.drawImage(video, 0, 0, w, h);
                    const r = window.jsQR(cx.getImageData(0, 0, w, h).data, w, h, { inversionAttempts: 'dontInvert' });
                    if (r) handle(r.data);
                }
            } catch (e) { }
            busy = false;
        };
        requestAnimationFrame(tick);
    }
    async function qrDone() {
        qrScanOn = false;
        const rx = qrRx; let data;
        try {
            const b = Array.from({ length: rx.n }, (_, i) => rx.parts[i]).join('');
            data = JSON.parse(await qrUnpack(rx.f, b));
            if (!data || !data.classes) throw new Error('contenu inattendu');
        } catch (e) { qrStopAll(); alert('Réception incomplète ou illisible : recommence. (' + e.message + ')'); return; }
        qrStopAll();
        qrRx = { data };
        const nCls = Object.keys(data.classes).length, nSt = Object.values(data.classes).reduce((a, c) => a + (c.students || []).length, 0);
        syShowModal('qr-modal', `<h3 class="text-xl font-bold mb-2 font-title">✅ Données reçues</h3><p class="text-sm text-gray-700 mb-3">${nCls} classe(s), ${nSt} élève(s). Que veux-tu en faire ?</p><div class="space-y-2"><button data-qr="merge" class="w-full bg-green-600 text-white px-4 py-3 text-left"><b>🔀 Fusionner</b><br><span class="text-sm">Données venant d'une tablette d'élèves : récupère inscriptions et demandes d'aide, sans toucher aux ceintures.</span></button><button data-qr="restore" class="w-full bg-indigo-600 text-white px-4 py-3 text-left"><b>♻️ Restaurer</b><br><span class="text-sm">Données de référence (ton téléphone) : remplacent tout le contenu de cet appareil.</span></button></div><div class="flex justify-end mt-4"><button data-qr="close" class="bg-gray-300 px-4 py-2">Annuler</button></div>`);
    }
    document.addEventListener('click', e => {
        const b = e.target.closest('[data-qr]');
        if (!b) { if (e.target.id === 'qr-modal' && !qrScanOn) qrStopAll(); return; }
        const a = b.dataset.qr;
        if (a === 'send') qrSend();
        else if (a === 'receive') qrReceive();
        else if (a === 'close') qrStopAll();
        else if (a === 'slower') qrSend.speed && qrSend.speed(1.5);
        else if (a === 'faster') qrSend.speed && qrSend.speed(1 / 1.5);
        else if (a === 'sent') { qrStopAll(); syMarkTransferred(); toast('✅ Transfert effectué'); }
        else if (a === 'merge' || a === 'restore') {
            const data = qrRx && qrRx.data; qrStopAll(); if (!data) return;
            if (a === 'merge') syOpenMerge([{ name: 'QR codes', data }]);
            else { try { handleRestore(data); } catch (err) { alert('Erreur : ' + err.message); } }
            qrRx = null;
        }
    });
    window.addEventListener('pagehide', () => { if (qrStream) qrStopAll(); });

    loadState();
    syInit();
    showScreen('home-screen');
});
</script>
